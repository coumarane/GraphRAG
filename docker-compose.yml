name: enterprise-rag

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: enterprise_rag
      POSTGRES_USER: enterprise_rag
      POSTGRES_PASSWORD: change-me
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U enterprise_rag -d enterprise_rag"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/enterprise-rag &&
      exit 0
      "

  qdrant:
    image: qdrant/qdrant:v1.13.6
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333'"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/change-me-change-me
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  migrate:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      target: api
    environment: &app_env
      APP_ENVIRONMENT: development
      APP_CONFIG_DIR: /app/config
      OBJECT_STORE_BACKEND: minio
      VECTOR_STORE_BACKEND: qdrant
      GRAPH_STORE_BACKEND: neo4j
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      METADATA_STORE_BACKEND: postgres
      INGEST_EXECUTION: worker
      INGEST_QUEUE_BACKEND: redis
      POSTGRES__HOST: postgres
      POSTGRES__PORT: "5432"
      POSTGRES__DB: enterprise_rag
      POSTGRES__USER: enterprise_rag
      POSTGRES__PASSWORD: change-me
      REDIS__URL: redis://redis:6379/0
      MINIO__ENDPOINT: minio:9000
      MINIO__ACCESS_KEY: minioadmin
      MINIO__SECRET_KEY: minioadmin
      MINIO__SECURE: "false"
      MINIO__BUCKET: enterprise-rag
      QDRANT__URL: http://qdrant:6333
      NEO4J__URI: bolt://neo4j:7687
      NEO4J__USER: neo4j
      NEO4J__PASSWORD: change-me-change-me
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile
      target: api
    environment:
      <<: *app_env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/v1/health/live"]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.worker
    environment:
      <<: *app_env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped

  worker-gpu:
    profiles: ["gpu"]
    build:
      context: ./backend
      dockerfile: docker/Dockerfile.worker
    environment:
      <<: *app_env
      NVIDIA_VISIBLE_DEVICES: all
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      RAG_API_URL: http://api:8000
      NEXT_PUBLIC_DEFAULT_TENANT_KEY: demo
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
  neo4j_data:
