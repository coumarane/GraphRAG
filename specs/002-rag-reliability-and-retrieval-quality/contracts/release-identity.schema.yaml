$schema: https://json-schema.org/draft/2020-12/schema
$title: ReleaseIdentity
$description: >
  Serving digests in the Kubernetes kustomization and rollback digests in
  infra/dev/release-gate.json. rollback_in_effect is additive.

type: object
required: [promote, rollback_digests, rollback_in_effect]
properties:
  promote:
    type: object
    required: [api, worker, web]
    properties:
      api: {type: boolean}
      worker: {type: boolean}
      web: {type: boolean}
  rollback_digests:
    type: object
    required: [api, worker, web]
    additionalProperties: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}
  rollback_in_effect: {type: boolean}
  serving_digests:
    type: object
    description: Read from infra/k8s/{api,worker,web}/kustomization.yaml. Not copied into the gate file.
    required: [api, worker, web]
    additionalProperties: {type: string, pattern: "^sha256:[0-9a-f]{64}$"}

rules:
  - promote.api, promote.worker, and promote.web stay false unless an explicit promotion of a reviewed image is in progress.
  - A promotion changes serving_digests for that part and writes the previous serving digest into rollback_digests. It does not write the new digest into rollback_digests.
  - When rollback_in_effect is false, each serving digest differs from that part's rollback digest.
  - When rollback_in_effect is true, serving digests equal rollback digests.
  - This feature's specification change does not modify either digest and does not set rollback_in_effect.
