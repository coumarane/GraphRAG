$schema: https://json-schema.org/draft/2020-12/schema
$title: CitationAndEvidence
$description: >
  Page and score rules for POST /api/v1/retrieval/search and POST /api/v1/query.
  Existing fields stay. Search gains the same emptiness rules as the answer.

type: object
properties:
  evidence:
    type: array
    items:
      type: object
      required: [document_id, page_start, page_end, text]
      properties:
        document_id: {type: string, format: uuid}
        page_start: {type: integer, minimum: 1}
        page_end: {type: integer, minimum: 1}
        text: {type: string}
        score: {type: number}
        score_components:
          type: object
          additionalProperties: {type: number}
  citations:
    type: array
    items:
      type: object
      required: [document_id, page_start, page_end, evidence]
      properties:
        document_id: {type: string, format: uuid}
        page_start: {type: integer, minimum: 1}
        page_end: {type: integer, minimum: 1}
        evidence: {type: string}
  warnings:
    type: array
    items: {type: string}

rules:
  - page_end is greater than or equal to page_start.
  - For one passage, search evidence and the answer citation use the same document_id, page_start, and page_end.
  - A page range is the passage range. A span of three or more pages is not rewritten to the start page.
  - The quoted text occurs on a page inside that range.
  - A passage whose retrieval score is below 0.12 is absent from evidence and citations.
  - The 0.12 comparison uses the retrieval score, not score_components.normalized and not a reciprocal-rank score.
  - When the selected documents contain none of a distinctive phrase from the question, evidence and citations are empty and warnings include selection_has_no_supporting_evidence.
  - document_id values stay inside the caller organization and inside document_ids when that filter was sent.
