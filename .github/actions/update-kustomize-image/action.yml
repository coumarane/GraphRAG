name: Update Kustomize Image
description: Update a kustomization image to a pushed digest and commit the change

inputs:
  git-ref:
    description: Git ref to update
    required: false
    default: dev
  github-token:
    description: Token used to push the GitOps commit
    required: true
  image-name:
    description: Full image name in the kustomization file
    required: true
  image-ref:
    description: Full image ref to set, including digest
    required: true
  digest:
    description: Image digest, with or without @ prefix
    required: true
  kustomization-dir:
    description: Directory containing the kustomization file
    required: true
  commit-message:
    description: Commit message to use
    required: true

runs:
  using: composite
  steps:
    - name: Update kustomization and push
      shell: bash
      run: |
        set -euo pipefail

        GIT_REF="${{ inputs.git-ref }}"
        GITHUB_TOKEN="${{ inputs.github-token }}"
        KUSTOMIZATION_DIR="${{ inputs.kustomization-dir }}"
        IMAGE_NAME="${{ inputs.image-name }}"
        IMAGE_REF="${{ inputs.image-ref }}"
        DIGEST="${{ inputs.digest }}"
        DIGEST="${DIGEST#@}"
        COMMIT_MESSAGE="${{ inputs.commit-message }}"

        git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        git config user.name "github-actions"
        git config user.email "actions@github.com"

        if ! command -v kustomize >/dev/null 2>&1; then
          curl -sSL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/
        fi

        # Concurrent api/web/worker GitOps commits race on the same branch.
        # Rebase and retry on non-fast-forward and GitHub commit_refs failures.
        for attempt in 1 2 3 4 5 6; do
          git fetch origin "${GIT_REF}"
          git checkout "${GIT_REF}"
          git reset --hard "origin/${GIT_REF}"

          (
            cd "${KUSTOMIZATION_DIR}"
            kustomize edit set image "${IMAGE_NAME}=${IMAGE_REF%@*}@${DIGEST}"
          )
          git add "${KUSTOMIZATION_DIR}/kustomization.yaml"
          if git diff --cached --quiet; then
            echo "Image digest already set; nothing to commit"
            exit 0
          fi
          git commit -m "${COMMIT_MESSAGE}"

          if git push origin "${GIT_REF}"; then
            exit 0
          fi
          echo "GitOps push failed (attempt ${attempt}/6); retrying after rebase"
          git reset --hard "HEAD^"
          sleep $((attempt * 3))
        done

        echo "GitOps push failed after retries"
        exit 1
