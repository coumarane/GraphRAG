name: Deploy PostgreSQL 18

on:
  workflow_dispatch:
    inputs:
      postgres_version:
        description: "PostgreSQL version to install (default 18)"
        required: false
        default: "18"
      target_host:
        description: "Hostname or IP where PostgreSQL should be installed"
        required: false
        default: database.chatwithdocs.org

env:
  ANSIBLE_HOST_KEY_CHECKING: "False"

jobs:
  deploy:
    name: Run Ansible PostgreSQL Playbook
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip sshpass
          pip install ansible

      - name: Install Ansible collections
        run: |
          ansible-galaxy collection install community.postgresql

      - name: Run PostgreSQL playbook
        env:
          CONTABO_ROOT_PASSWORD: ${{ secrets.CONTABO_VM2_ROOT_PASSWORD }}
          POSTGRES_VERSION: ${{ inputs.postgres_version }}
          TARGET_HOST: ${{ inputs.target_host }}
          POSTGRES_ADMIN_PASSWORD: ${{ secrets.POSTGRES_ADMIN_PASSWORD }}
          POSTGRES_APP_DB: ${{ secrets.POSTGRES_APP_DB }}
          POSTGRES_APP_USER: ${{ secrets.POSTGRES_APP_USER }}
          POSTGRES_APP_PASSWORD: ${{ secrets.POSTGRES_APP_PASSWORD }}
          PGADMIN_EMAIL: ${{ secrets.PGADMIN_EMAIL }}
          PGADMIN_PASSWORD: ${{ secrets.PGADMIN_PASSWORD }}
        run: |
          ansible-playbook infra/ansible/postgresql/playbook.yml \
            -i infra/ansible/postgresql/inventory.ini \
            --extra-vars "ansible_password=${CONTABO_ROOT_PASSWORD} postgres_version=${POSTGRES_VERSION:-18} ansible_host=${TARGET_HOST:-database.chatwithdocs.org} postgres_admin_password=${POSTGRES_ADMIN_PASSWORD} postgres_app_db=${POSTGRES_APP_DB} postgres_app_user=${POSTGRES_APP_USER} postgres_app_password=${POSTGRES_APP_PASSWORD} pgadmin_email=${PGADMIN_EMAIL} pgadmin_password=${PGADMIN_PASSWORD}"
