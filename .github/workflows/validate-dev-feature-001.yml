name: Validate Feature 001 DEV

on:
  workflow_dispatch:
  repository_dispatch:
    types: [validate-dev-feature-001]

permissions:
  contents: read
  id-token: write

env:
  K8S_INVENTORY: infra/ansible/kubernetes/inventory.ini

jobs:
  validate:
    name: Post-deployment validation
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 35
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Public endpoints
        run: |
          set -euo pipefail
          curl -sS -o /dev/null -w 'live %{http_code}\n' https://api.chatwithdocs.org/api/v1/health/live
          curl -sS -o /dev/null -w 'ready %{http_code}\n' https://api.chatwithdocs.org/api/v1/health/ready
          curl -sS -o /dev/null -w 'login_page %{http_code}\n' https://chatwithdocs.org/login
          curl -sS -D - -o /dev/null -X OPTIONS \
            -H 'Origin: https://chatwithdocs.org' \
            -H 'Access-Control-Request-Method: PUT' \
            -H 'Access-Control-Request-Headers: x-ms-blob-type,content-type' \
            'https://graphragdocsdevbmo9.blob.core.windows.net/documents/cors-preflight-check' \
            | awk 'BEGIN{IGNORECASE=1} /^HTTP|^access-control-|^content-length/'

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Restore shared SSH key from Key Vault
        id: restore_shared_ssh
        uses: ./.github/actions/restore-ssh-key-from-keyvault
        with:
          key-vault-name: ${{ vars.AZURE_KEY_VAULT_NAME }}
          secret-name: ${{ vars.OVH_SSH_PRIVATE_KEY_SECRET_NAME || 'ovh-rag-reinstall-ssh-private-key' }}
          key-path: ${{ vars.OVH_SSH_PRIVATE_KEY_PATH || '~/.ssh/ovh-rag-reinstall-ed25519' }}

      - name: Configure SSH for master
        id: master_ssh
        uses: ./.github/actions/configure-ssh-from-inventory
        with:
          inventory-path: ${{ env.K8S_INVENTORY }}
          inventory-group: master
          ssh-private-key-file: ${{ steps.restore_shared_ssh.outputs.key-path }}
          ssh-user: ubuntu

      - name: Inspect document, queue, and logs
        env:
          MASTER_HOST: ${{ steps.master_ssh.outputs.first-host }}
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes "$MASTER_HOST" 'bash -s' <<'EOSSH'
          set -euo pipefail
          export KUBECONFIG=/home/ubuntu/.kube/config
          echo "=== argo ==="
          kubectl -n argocd get applications.argoproj.io -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status,REV:.status.sync.revision
          api_image=$(kubectl -n chatwithdocs-api get deploy api -o jsonpath='{.spec.template.spec.containers[0].image}')
          worker_image=$(kubectl -n chatwithdocs-api get deploy ingestion-worker -o jsonpath='{.spec.template.spec.containers[0].image}')
          web_image=$(kubectl -n chatwithdocs-web get deploy web -o jsonpath='{.spec.template.spec.containers[0].image}')
          echo "api_image $api_image"
          echo "worker_image $worker_image"
          echo "web_image $web_image"
          case "$api_image" in
            *sha256:a37d49446261592e9084dc1cc32092ebfe7318b1d82e7456757c61a1ff05b71a*) echo api_digest_unchanged true ;;
            *) echo api_digest_unchanged false ;;
          esac
          case "$worker_image" in
            *sha256:5bbba7ec2dfc5b7d9bdf1e1dd1c1cd1e18f037447e92536f13afda40f5e66fb1*) echo worker_digest_unchanged true ;;
            *) echo worker_digest_unchanged false ;;
          esac
          case "$web_image" in
            *sha256:eb34e619be4107352fbb0ce3e543e8b368865059746060809589afe6d290dc84*) echo web_digest_unchanged true ;;
            *) echo web_digest_unchanged false ;;
          esac
          echo "=== worker restart ==="
          kubectl -n chatwithdocs-api get pods -l app.kubernetes.io/name=chatwithdocs-worker -o jsonpath='{range .items[*]}{.metadata.name}{" restarts="}{.status.containerStatuses[0].restartCount}{" reason="}{.status.containerStatuses[0].lastState.terminated.reason}{" exit="}{.status.containerStatuses[0].lastState.terminated.exitCode}{" finished="}{.status.containerStatuses[0].lastState.terminated.finishedAt}{" started="}{.status.containerStatuses[0].state.running.startedAt}{"\n"}{end}'
          echo
          echo "=== pods ==="
          kubectl -n chatwithdocs-api get pods -o jsonpath='{range .items[*]}{.metadata.name}{" ready="}{.status.containerStatuses[0].ready}{" restarts="}{.status.containerStatuses[0].restartCount}{"\n"}{end}'
          kubectl -n chatwithdocs-web get pods -o jsonpath='{range .items[*]}{.metadata.name}{" ready="}{.status.containerStatuses[0].ready}{" restarts="}{.status.containerStatuses[0].restartCount}{"\n"}{end}'
          pod=$(kubectl -n chatwithdocs-api get pods -l app.kubernetes.io/name=chatwithdocs-api -o jsonpath='{range .items[?(@.status.containerStatuses[0].ready==true)]}{.metadata.name}{"\n"}{end}' | head -n 1)
          echo "pod=${pod}"
          test -n "$pod"
          set +e
          kubectl -n chatwithdocs-api exec -i "$pod" -- python - <<'PY'
          import asyncio
          import json
          import re
          import time
          import urllib.error
          import urllib.request
          from pathlib import Path

          DOC = "01a19439-4152-7b32-a7f3-7125ee8fb480"
          TERMINAL_RUN = {
              "completed",
              "completed_with_warnings",
              "partial",
              "failed",
              "cancelled",
          }
          TERMINAL_DOC = {"ready", "partial", "failed", "deleted"}


          def redact(value):
              text = str(value).replace("\n", " ")
              text = re.sub(r"(?i)(password|sig|access_token|authorization)=[^&\s\"]+", r"\1=redacted", text)
              text = re.sub(r"rediss?://\S+", "redis://redacted", text)
              text = re.sub(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}", "<email>", text)
              return text[:240]


          def load_env():
              env = {}
              for line in Path("/app/.env").read_text().splitlines():
                  if not line or line.startswith("#") or "=" not in line:
                      continue
                  key, value = line.split("=", 1)
                  env[key] = value
              return env


          def request(method, url, payload=None, headers=None, timeout=90):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, method=method)
              for key, value in (headers or {}).items():
                  req.add_header(key, value)
              if payload is not None:
                  req.add_header("content-type", "application/json")
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()


          def parse(raw):
              try:
                  return json.loads(raw) if raw else None
              except json.JSONDecodeError:
                  return None


          def print_run(run):
              print("run_id", run.get("ingestion_run_id"))
              print("run_status", run.get("status"))
              print("progress_state", run.get("progress_state"))
              print("current_stage", run.get("current_stage"))
              print("last_completed_stage", run.get("last_completed_stage"))
              print("latest_warning", redact(run.get("latest_warning") or ""))
              print("error_code", run.get("error_code"))
              print("error_message", redact(run.get("error_message") or ""))
              print("parser_used", run.get("parser_used"))
              print("pages_processed", run.get("pages_processed"))
              print("elements_processed", run.get("elements_processed"))
              print("worker_id_set", bool(run.get("worker_id")))
              watched = {
                  "PARSE",
                  "CHUNK",
                  "EMBED",
                  "INDEX_VECTOR",
                  "EXTRACT_GRAPH",
                  "RESOLVE_ENTITIES",
                  "INDEX_GRAPH",
                  "FINALIZE",
              }
              for stage in run.get("stages") or []:
                  name = stage.get("stage")
                  if name not in watched and stage.get("status") not in {"failed", "completed_with_warnings"}:
                      continue
                  extra = ""
                  if stage.get("warning"):
                      extra += " warning=" + redact(stage.get("warning"))
                  if stage.get("error_message"):
                      extra += " error=" + redact(stage.get("error_message"))
                  print(
                      "stage",
                      name,
                      stage.get("status"),
                      "attempts=" + str(stage.get("attempt_count")),
                      extra,
                  )


          async def db_and_redis(env, tenant_id, run_id):
              try:
                  import redis

                  client = redis.Redis.from_url(env.get("REDIS_URL", ""), socket_timeout=5)
                  print("redis_ping", bool(client.ping()))
                  for key in ("ingestion-jobs", "ingestion-dlq"):
                      print("redis_xlen", key, int(client.xlen(key)))
                  try:
                      info = client.xpending("ingestion-jobs", "ingestion-workers")
                      pending = info.get("pending") if isinstance(info, dict) else (info[0] if info else None)
                      print("redis_jobs_pending", pending)
                      entries = client.xpending_range("ingestion-jobs", "ingestion-workers", "-", "+", 5)
                      print("redis_pending_entries", len(entries))
                      for entry in entries:
                          idle = entry.get("time_since_delivered") if isinstance(entry, dict) else None
                          times = entry.get("times_delivered") if isinstance(entry, dict) else None
                          message_id = entry.get("message_id") if isinstance(entry, dict) else None
                          print("redis_pending_entry", "idle_ms", idle, "deliveries", times)
                          if not message_id:
                              continue
                          for _item_id, fields in client.xrange("ingestion-jobs", min=message_id, max=message_id, count=1):
                              raw = fields.get(b"payload") or fields.get("payload") or b"{}"
                              if isinstance(raw, bytes):
                                  raw = raw.decode("utf-8", "replace")
                              payload = json.loads(raw)
                              print(
                                  "redis_pending_job",
                                  "run", payload.get("ingestion_run_id"),
                                  "document", payload.get("document_id"),
                              )
                  except Exception as exc:
                      print("redis_jobs_pending_error", type(exc).__name__, redact(exc))
              except Exception as exc:
                  print("redis_error", type(exc).__name__, redact(exc))

              try:
                  import asyncpg

                  conn = await asyncpg.connect(
                      host=env["POSTGRES_HOST"],
                      port=int(env.get("POSTGRES_PORT") or 5432),
                      user=env["POSTGRES_USER"],
                      password=env["POSTGRES_PASSWORD"],
                      database=env["POSTGRES_DB"],
                      ssl="prefer",
                      timeout=15,
                  )
                  try:
                      row = await conn.fetchrow(
                          """
                          SELECT
                            count(*) FILTER (WHERE published_at IS NULL) AS unpublished,
                            count(*) FILTER (WHERE published_at IS NOT NULL) AS published,
                            count(*) FILTER (WHERE published_at IS NULL AND last_error IS NOT NULL) AS unpublished_errors
                          FROM outbox_events
                          """
                      )
                      print("outbox_unpublished", row["unpublished"])
                      print("outbox_published", row["published"])
                      print("outbox_unpublished_errors", row["unpublished_errors"])
                      if run_id:
                          rows = await conn.fetch(
                              """
                              SELECT event_type,
                                     published_at IS NOT NULL AS published,
                                     publish_attempts,
                                     last_error IS NOT NULL AS has_error,
                                     left(coalesce(last_error, ''), 160) AS error
                              FROM outbox_events
                              WHERE aggregate_id = $1::uuid
                                 OR payload->>'ingestion_run_id' = $2
                                 OR payload->>'document_id' = $3
                              """,
                              run_id,
                              run_id,
                              DOC,
                          )
                          print("outbox_for_run", len(rows))
                          for item in rows:
                              print(
                                  "outbox_row",
                                  item["event_type"],
                                  "published",
                                  bool(item["published"]),
                                  "attempts",
                                  item["publish_attempts"],
                                  "has_error",
                                  bool(item["has_error"]),
                                  "error",
                                  redact(item["error"]),
                              )
                      if tenant_id:
                          async with conn.transaction():
                              await conn.execute("SELECT set_config('app.tenant_id', $1, true)", str(tenant_id))
                              if run_id:
                                  count = await conn.fetchval(
                                      "SELECT count(*) FROM ingestion_dead_letters WHERE ingestion_run_id = $1::uuid",
                                      run_id,
                                  )
                                  print("dead_letters_for_run", count)
                                  letters = await conn.fetch(
                                      """
                                      SELECT stage, error_code, attempt_count, left(error_message, 160) AS error
                                      FROM ingestion_dead_letters
                                      WHERE ingestion_run_id = $1::uuid
                                      ORDER BY created_at
                                      LIMIT 10
                                      """,
                                      run_id,
                                  )
                                  for letter in letters:
                                      print(
                                          "dead_letter",
                                          letter["stage"],
                                          letter["error_code"],
                                          "attempts",
                                          letter["attempt_count"],
                                          redact(letter["error"]),
                                      )
                              else:
                                  print("dead_letters_for_run", "skipped")
                  finally:
                      await conn.close()
              except Exception as exc:
                  print("db_error", type(exc).__name__, redact(exc))


          def main():
              env = load_env()
              email = env.get("AUTH_BOOTSTRAP_EMAIL", "").strip()
              password = env.get("AUTH_BOOTSTRAP_PASSWORD", "").strip()
              tenant = env.get("AUTH_BOOTSTRAP_TENANT_KEY", "demo").strip() or "demo"
              print("bootstrap_email_set", bool(email))
              print("bootstrap_password_set", bool(password))
              if not email or not password:
                  raise SystemExit(2)
              status, body = request(
                  "POST",
                  "http://127.0.0.1:8000/api/v1/auth/login",
                  {"email": email, "password": password},
              )
              print("login", status)
              if status != 200:
                  print("error_body", redact(body.decode("utf-8", "replace")))
                  raise SystemExit(1)
              token = json.loads(body)["access_token"]
              auth = {"Authorization": "Bearer " + token, "X-Tenant-Key": tenant}

              def call(method, path, payload=None, timeout=90):
                  status, raw = request(method, "http://127.0.0.1:8000" + path, payload, auth, timeout)
                  return status, parse(raw), raw

              doc = None
              run = None
              for attempt in range(4):
                  status, doc, raw = call("GET", "/api/v1/documents/" + DOC)
                  print("document_http", status, "attempt", attempt + 1)
                  if status != 200:
                      print("error_body", redact(raw.decode("utf-8", "replace")))
                      raise SystemExit(1)
                  print("document_status", doc.get("status"))
                  print("document_title", doc.get("title"))
                  print("version_id", doc.get("current_version_id"))
                  status, run, raw = call("GET", "/api/v1/documents/" + DOC + "/ingestion-runs/latest")
                  print("run_http", status)
                  if status != 200:
                      print("error_body", redact(raw.decode("utf-8", "replace")))
                      break
                  print_run(run)
                  done = doc.get("status") in TERMINAL_DOC and run.get("status") in TERMINAL_RUN
                  if done or attempt == 3:
                      break
                  time.sleep(15)

              status, chunks, raw = call("GET", "/api/v1/documents/" + DOC + "/chunks?limit=3")
              print("chunks_http", status)
              chunk_total = 0
              if status == 200 and isinstance(chunks, dict):
                  chunk_total = int(chunks.get("total") or 0)
                  print("chunks_total", chunk_total)
                  items = chunks.get("items") or []
                  print("chunks_returned", len(items))
                  if items:
                      print("first_chunk_chars", len(items[0].get("text") or ""))
              else:
                  print("error_body", redact(raw.decode("utf-8", "replace")))

              status, search, raw = call(
                  "POST",
                  "/api/v1/retrieval/search",
                  {
                      "question": "rollout-001",
                      "document_ids": [DOC],
                      "top_k": 5,
                      "include_graph_paths": True,
                  },
              )
              print("search_filtered_http", status)
              if status != 200 or not isinstance(search, dict):
                  print("error_body", redact(raw.decode("utf-8", "replace")))
              else:
                  evidence = search.get("evidence") or []
                  ids = sorted({str(item.get("document_id")) for item in evidence})
                  print("search_filtered_mode", search.get("mode"))
                  print("search_filtered_evidence", len(evidence))
                  print("search_filtered_document_ids", ",".join(ids) if ids else "none")
                  print("search_filtered_only_target", (not ids) or ids == [DOC])
                  print("search_filtered_warnings", redact(search.get("warnings") or ""))
                  print("search_filtered_graph_paths", len(search.get("graph_paths") or []))

              status, search, raw = call(
                  "POST",
                  "/api/v1/retrieval/search",
                  {"question": "rollout-001", "top_k": 5},
              )
              print("search_open_http", status)
              if status == 200 and isinstance(search, dict):
                  evidence = search.get("evidence") or []
                  ids = sorted({str(item.get("document_id")) for item in evidence})
                  print("search_open_evidence", len(evidence))
                  print("search_open_contains_document", DOC in ids)
                  print("search_open_document_ids", ",".join(ids) if ids else "none")
                  print("search_open_warnings", redact(search.get("warnings") or ""))
              else:
                  print("error_body", redact(raw.decode("utf-8", "replace")))

              if chunk_total == 0:
                  print("query_skipped", "no_chunks")
              else:
                  status, query, raw = call(
                      "POST",
                      "/api/v1/query",
                      {
                          "question": "What is in the rollout-001 document?",
                          "document_ids": [DOC],
                          "interaction_mode": "search",
                          "top_k": 5,
                      },
                      timeout=120,
                  )
                  print("query_http", status)
                  if status != 200 or not isinstance(query, dict):
                      print("error_body", redact(raw.decode("utf-8", "replace")))
                  else:
                      citations = query.get("citations") or []
                      ids = sorted({str(item.get("document_id")) for item in citations})
                      print("query_citations", len(citations))
                      print("query_citation_document_ids", ",".join(ids) if ids else "none")
                      print("query_citations_only_target", (not ids) or ids == [DOC])
                      names = sorted({str(item.get("document_name")) for item in citations})
                      print("query_citation_names", ",".join(names) if names else "none")
                      print("query_answer_chars", len(query.get("answer") or ""))
                      print("query_warnings", redact(query.get("warnings") or ""))

              tenant_id = doc.get("tenant_id") if isinstance(doc, dict) else None
              run_id = run.get("ingestion_run_id") if isinstance(run, dict) else None
              asyncio.run(db_and_redis(env, tenant_id, str(run_id) if run_id else None))


          if __name__ == "__main__":
              main()
          PY
          echo "document_check_exit $?"
          set -e
          echo "=== worker logs ==="
          kubectl -n chatwithdocs-api logs deploy/ingestion-worker --tail=2500 > /tmp/feature001-worker.log || true
          echo "worker_log_lines $(wc -l < /tmp/feature001-worker.log | tr -d ' ')"
          echo "worker_log_errorish $(grep -Eic 'error|exception' /tmp/feature001-worker.log || true)"
          echo "worker_log_matches $(grep -Ec '01a19439-4152-7b32-a7f3-7125ee8fb480|semantic_graph|dead_letter' /tmp/feature001-worker.log || true)"
          grep -E '01a19439-4152-7b32-a7f3-7125ee8fb480|semantic_graph|dead_letter' /tmp/feature001-worker.log \
            | sed -E "s/as '[^']*'/as '<redacted>'/g; s#rediss?://[^ ]*#redis://<redacted>#g; s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}/<email>/g" \
            | tail -n 25 \
            | sed 's/^/worker_log /' || true
          echo "=== api logs ==="
          kubectl -n chatwithdocs-api logs -l app.kubernetes.io/name=chatwithdocs-api --tail=800 --prefix > /tmp/feature001-api.log || true
          echo "api_log_lines $(wc -l < /tmp/feature001-api.log | tr -d ' ')"
          echo "api_log_errorish $(grep -Eic 'error|exception' /tmp/feature001-api.log || true)"
          echo "api_log_matches $(grep -Ec '01a19439-4152-7b32-a7f3-7125ee8fb480' /tmp/feature001-api.log || true)"
          grep -E '01a19439-4152-7b32-a7f3-7125ee8fb480|retrieval_branch_failed|retrieval/search' /tmp/feature001-api.log \
            | sed -E "s/as '[^']*'/as '<redacted>'/g; s#rediss?://[^ ]*#redis://<redacted>#g" \
            | tail -n 20 \
            | sed 's/^/api_log /' || true
          rm -f /tmp/feature001-worker.log /tmp/feature001-api.log
          EOSSH

      - name: Install Chromium
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pw" playwright
          sudo "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install-deps chromium
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install chromium

      - name: Read the DEV login from the API pod
        env:
          MASTER_HOST: ${{ steps.master_ssh.outputs.first-host }}
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes "$MASTER_HOST" 'bash -s' <<'EOSSH' > "$RUNNER_TEMP/creds.json"
          set -euo pipefail
          export KUBECONFIG=/home/ubuntu/.kube/config
          pod=$(kubectl -n chatwithdocs-api get pods -l app.kubernetes.io/name=chatwithdocs-api -o jsonpath='{range .items[?(@.status.containerStatuses[0].ready==true)]}{.metadata.name}{"\n"}{end}' | head -n 1)
          test -n "$pod"
          kubectl -n chatwithdocs-api exec -i "$pod" -- python - <<'PY'
          import json
          from pathlib import Path
          env = {}
          for line in Path("/app/.env").read_text().splitlines():
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              env[key] = value
          print(json.dumps({
              "email": env.get("AUTH_BOOTSTRAP_EMAIL", "").strip(),
              "password": env.get("AUTH_BOOTSTRAP_PASSWORD", "").strip(),
              "tenant": (env.get("AUTH_BOOTSTRAP_TENANT_KEY", "demo").strip() or "demo"),
          }))
          PY
          EOSSH
          python3 - << 'CHK'
          import json, os
          from pathlib import Path
          raw = Path(os.environ["RUNNER_TEMP"], "creds.json").read_text()
          start = raw.find("{")
          end = raw.rfind("}")
          data = json.loads(raw[start:end + 1])
          Path(os.environ["RUNNER_TEMP"], "creds.json").write_text(json.dumps(data))
          print("creds_email_set", bool(data.get("email")))
          print("creds_password_set", bool(data.get("password")))
          print("creds_tenant_set", bool(data.get("tenant")))
          CHK

      - name: Exercise the browser upload journey
        env:
          NODE_PATH: ${{ runner.temp }}/pw/node_modules
          CREDS_FILE: ${{ runner.temp }}/creds.json
          PDF_FILE: ${{ runner.temp }}/accept-001.pdf
          EXE_FILE: ${{ runner.temp }}/not-a-document.exe
          NEW_DOC_FILE: ${{ runner.temp }}/new-doc-id
          SHOT_DIR: ${{ runner.temp }}/shots
        run: |
          set -euo pipefail
          mkdir -p "$SHOT_DIR"
          python3 - << 'PDF'
          import os
          from pathlib import Path
          pdf = b"""%PDF-1.4
          1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj
          2 0 obj << /Type /Pages /Count 1 /Kids [3 0 R] >> endobj
          3 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 300 144] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >> endobj
          4 0 obj << /Length 73 >> stream
          BT /F1 18 Tf 36 90 Td (accept-001 rollout validation) Tj ET
          endstream
          endobj
          5 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica >> endobj
          trailer << /Root 1 0 R >>
          %%EOF
          """
          Path(os.environ["PDF_FILE"]).write_bytes(pdf)
          Path(os.environ["EXE_FILE"]).write_bytes(b"not a document\n")
          Path(os.environ["NEW_DOC_FILE"]).write_text("")
          PDF
          cat > "$RUNNER_TEMP/browser.mjs" << 'JS'
          import fs from "node:fs";
          import { chromium } from "playwright";

          const creds = JSON.parse(fs.readFileSync(process.env.CREDS_FILE, "utf8"));
          const pdfPath = process.env.PDF_FILE;
          const exePath = process.env.EXE_FILE;
          const shotDir = process.env.SHOT_DIR;

          function redact(value) {
            return String(value)
              .replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g, "<email>")
              .replace(/(sig|password|access_token)=[^&\s"]+/gi, "$1=redacted")
              .replace(/https?:\/\/\S+/g, "<url>")
              .slice(0, 240);
          }

          const consoleErrors = [];
          const pageErrors = [];
          const failedRequests = [];

          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1280, height: 900 } });
          page.on("console", (message) => {
            if (message.type() === "error") consoleErrors.push(redact(message.text()));
          });
          page.on("pageerror", (error) => pageErrors.push(redact(error.message || error)));
          page.on("requestfailed", (request) => {
            failedRequests.push(`${request.method()} ${redact(request.url())} ${request.failure()?.errorText || ""}`);
          });

          async function shot(name) {
            await page.screenshot({ path: `${shotDir}/${name}.png`, fullPage: true });
          }

          try {
            await page.goto("https://chatwithdocs.org/login", { waitUntil: "domcontentloaded" });
            await page.getByLabel("Email").fill(creds.email);
            await page.getByLabel("Password").fill(creds.password);
            await page.getByRole("button", { name: "Sign in" }).click();
            await page.waitForURL((url) => !url.pathname.startsWith("/login"), { timeout: 20000 });
            console.log("browser_login", page.url().includes("/login") ? "failed" : "ok");
            console.log("browser_after_login_path", new URL(page.url()).pathname);

            await page.goto("https://chatwithdocs.org/documents", { waitUntil: "domcontentloaded" });
            await page.getByRole("heading", { name: "Documents" }).waitFor({ timeout: 15000 });
            const known = page.locator("tr", { hasText: "01a19439-4152-7b32-a7f3-7125ee8fb480" });
            console.log("browser_known_document_visible", (await known.count()) > 0);
            if ((await known.count()) > 0) {
              console.log("browser_known_document_row", redact(await known.first().innerText()));
            }
            console.log("browser_rollout_title_visible", (await page.getByText("rollout-001").count()) > 0);
            await shot("documents-before");

            await page.goto("https://chatwithdocs.org/upload", { waitUntil: "domcontentloaded" });
            await page.getByRole("heading", { name: "Upload" }).waitFor();
            const submit = page.getByRole("button", { name: "Upload & register" });
            console.log("browser_submit_disabled_without_file", await submit.isDisabled());

            await page.locator("input[type=file]").setInputFiles(exePath);
            await page.getByLabel("Title (optional)").fill("failure-001");
            await submit.click();
            const failure = page.locator("p").filter({ hasText: /.+/ }).last();
            await page.waitForTimeout(4000);
            const failureText = await page.locator("body").innerText();
            const failureLine = failureText
              .split("\n")
              .map((line) => line.trim())
              .find((line) => /could not|already uploaded|unsupported|invalid|error|failed/i.test(line));
            console.log("browser_failure_message", redact(failureLine || "none"));
            console.log("browser_failure_accepted", failureText.includes("status accepted"));
            await shot("failure");

            await page.goto("https://chatwithdocs.org/upload", { waitUntil: "domcontentloaded" });
            await page.locator("input[type=file]").setInputFiles(pdfPath);
            await page.getByLabel("Title (optional)").fill("accept-001");
            const putPromise = page.waitForRequest((request) => request.method() === "PUT", { timeout: 30000 });
            const putResponsePromise = page.waitForResponse(
              (response) => response.request().method() === "PUT",
              { timeout: 30000 },
            );
            await page.getByRole("button", { name: "Upload & register" }).click();
            const put = await putPromise;
            const putUrl = new URL(put.url());
            console.log("browser_put_host", putUrl.host);
            console.log("browser_put_has_uploads", putUrl.pathname.includes("/uploads/"));
            console.log("browser_put_has_staging", putUrl.pathname.includes("/staging/"));
            const putResponse = await putResponsePromise;
            console.log("browser_put_status", putResponse.status());
            await page.getByText("status accepted").waitFor({ timeout: 30000 });
            let body = await page.locator("body").innerText();
            const docMatch = body.match(/document_id\s+([0-9a-f-]{36})/i);
            const newId = docMatch ? docMatch[1] : "";
            console.log("browser_new_document_id", newId || "missing");
            fs.writeFileSync(process.env.NEW_DOC_FILE, newId);
            const deadline = Date.now() + 90000;
            let runLine = "";
            while (Date.now() < deadline) {
              body = await page.locator("body").innerText();
              runLine = body.split("\n").find((line) => line.trim().startsWith("run ")) || "";
              if (/completed|completed_with_warnings|failed|partial|cancelled/.test(runLine)) break;
              await page.waitForTimeout(3000);
            }
            console.log("browser_run_line", redact(runLine || "missing"));
            const stageLines = body
              .split("\n")
              .map((line) => line.trim())
              .filter((line) => /^(PARSE|CHUNK|EMBED|INDEX_VECTOR|INDEX_GRAPH|FINALIZE)\b/.test(line));
            console.log("browser_stage_lines", stageLines.length ? stageLines.join(" | ") : "none");
            await shot("upload-progress");

            await page.goto("https://chatwithdocs.org/documents", { waitUntil: "domcontentloaded" });
            await page.getByRole("heading", { name: "Documents" }).waitFor();
            console.log("browser_accept_title_visible", (await page.getByText("accept-001").count()) > 0);
            console.log("browser_failure_title_visible", (await page.getByText("failure-001").count()) > 0);
            await shot("documents-after");
          } catch (error) {
            console.log("browser_exception", redact(error && error.message ? error.message : error));
            try {
              await shot("exception");
            } catch {
              console.log("browser_exception_screenshot", "failed");
            }
          } finally {
            console.log("browser_console_errors", consoleErrors.length);
            for (const line of consoleErrors.slice(0, 20)) console.log("console_error", line);
            console.log("browser_page_errors", pageErrors.length);
            for (const line of pageErrors.slice(0, 10)) console.log("page_error", line);
            console.log("browser_failed_requests", failedRequests.length);
            for (const line of failedRequests.slice(0, 15)) console.log("failed_request", redact(line));
            await browser.close();
          }
          JS
          cp "$RUNNER_TEMP/browser.mjs" "$RUNNER_TEMP/pw/browser.mjs"
          node "$RUNNER_TEMP/pw/browser.mjs"

      - name: Track the browser document
        env:
          MASTER_HOST: ${{ steps.master_ssh.outputs.first-host }}
          NEW_DOC_FILE: ${{ runner.temp }}/new-doc-id
        run: |
          set -euo pipefail
          new_id=$(tr -d '[:space:]' < "$NEW_DOC_FILE" || true)
          if [ -z "$new_id" ]; then
            echo "new_document_poll skipped"
            exit 0
          fi
          echo "new_document_id $new_id"
          case "$new_id" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]-*) ;;
            *) echo "new_document_poll invalid_id"; exit 0 ;;
          esac
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes "$MASTER_HOST" "NEW_DOC_ID='$new_id' bash -s" <<'EOSSH'
          set -euo pipefail
          export KUBECONFIG=/home/ubuntu/.kube/config
          pod=$(kubectl -n chatwithdocs-api get pods -l app.kubernetes.io/name=chatwithdocs-api -o jsonpath='{range .items[?(@.status.containerStatuses[0].ready==true)]}{.metadata.name}{"\n"}{end}' | head -n 1)
          test -n "$pod"
          kubectl -n chatwithdocs-api exec -i "$pod" -- env NEW_DOC_ID="$NEW_DOC_ID" python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          from pathlib import Path
          DOC = os.environ["NEW_DOC_ID"]
          env = {}
          for line in Path("/app/.env").read_text().splitlines():
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              env[key] = value
          email = env.get("AUTH_BOOTSTRAP_EMAIL", "").strip()
          password = env.get("AUTH_BOOTSTRAP_PASSWORD", "").strip()
          tenant = env.get("AUTH_BOOTSTRAP_TENANT_KEY", "demo").strip() or "demo"

          def request(method, url, payload=None, headers=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, method=method)
              for key, value in (headers or {}).items():
                  req.add_header(key, value)
              if payload is not None:
                  req.add_header("content-type", "application/json")
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()

          status, body = request("POST", "http://127.0.0.1:8000/api/v1/auth/login", {"email": email, "password": password})
          print("new_login", status)
          if status != 200:
              raise SystemExit(0)
          token = json.loads(body)["access_token"]
          auth = {"Authorization": "Bearer " + token, "X-Tenant-Key": tenant}
          terminal_run = {"completed", "completed_with_warnings", "partial", "failed", "cancelled"}
          terminal_doc = {"ready", "partial", "failed", "deleted"}
          for attempt in range(12):
              status, raw = request("GET", "http://127.0.0.1:8000/api/v1/documents/" + DOC, headers=auth)
              doc = json.loads(raw) if status == 200 else {}
              status_run, raw_run = request("GET", "http://127.0.0.1:8000/api/v1/documents/" + DOC + "/ingestion-runs/latest", headers=auth)
              run = json.loads(raw_run) if status_run == 200 else {}
              print("new_attempt", attempt + 1, "document_http", status, "document_status", doc.get("status"), "run_http", status_run, "run_status", run.get("status"), "progress", run.get("progress_state"), "stage", run.get("current_stage"))
              if doc.get("status") in terminal_doc and run.get("status") in terminal_run:
                  for stage in run.get("stages") or []:
                      if stage.get("stage") in {"PARSE", "CHUNK", "EMBED", "INDEX_VECTOR", "EXTRACT_GRAPH", "INDEX_GRAPH", "FINALIZE"} or stage.get("status") in {"failed", "completed_with_warnings"}:
                          print("new_stage", stage.get("stage"), stage.get("status"))
                  print("new_latest_warning", (run.get("latest_warning") or "")[:180])
                  print("new_error_code", run.get("error_code"))
                  break
              time.sleep(20)
          else:
              print("new_document_still_running", "true")
          PY
          EOSSH

      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-001-browser
          path: ${{ runner.temp }}/shots
          if-no-files-found: ignore

      - name: Remove login material
        if: always()
        run: rm -f "$RUNNER_TEMP/creds.json"
