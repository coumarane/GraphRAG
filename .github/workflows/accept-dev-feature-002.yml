name: Accept Feature 002

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Ref to check. Does not promote an image or change a DEV digest."
        required: false
        default: "cursor/002-dev-acceptance-7784"
        type: string
  repository_dispatch:
    types: [accept-dev-feature-002]
  pull_request:
    paths:
      - ".github/workflows/accept-dev-feature-002.yml"
      - "backend/tests/unit/test_citation_page_range.py"
      - "backend/tests/unit/test_retrieval_evidence_floor.py"
      - "backend/tests/unit/test_structural_graph_paths.py"
      - "backend/tests/unit/test_worker_liveness.py"
      - "backend/tests/unit/test_release_identity.py"

permissions:
  contents: read
  id-token: write

jobs:
  product-check:
    name: Feature 002 product check
    runs-on: ubuntu-latest
    steps:
      # workflow_dispatch reads this file from the default branch and checks out
      # git_ref. A pull request checks out that pull request. Neither path promotes.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.event.client_payload.git_ref || inputs.git_ref || 'dev' }}
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Generate a four-page PDF and run the product check
        working-directory: backend
        run: |
          set -euo pipefail
          uv sync --all-extras
          python - <<'CHK'
          from pathlib import Path

          sentences = [
              "Page one introduces the citrine serum base.",
              "Page two cites ceramide at two percent.",
              "Page three records the twelve week stability claim.",
              "Page four states the usage is twice daily.",
          ]
          font_id = 3
          content_ids = list(range(4, 4 + len(sentences)))
          page_ids = list(range(4 + len(sentences), 4 + 2 * len(sentences)))
          objects = {
              1: "<< /Type /Catalog /Pages 2 0 R >>",
              3: "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica >>",
          }
          kids = " ".join(f"{page_id} 0 R" for page_id in page_ids)
          objects[2] = f"<< /Type /Pages /Count {len(sentences)} /Kids [{kids}] >>"
          for sentence, content_id, page_id in zip(sentences, content_ids, page_ids, strict=True):
              stream = f"BT /F1 18 Tf 72 720 Td ({sentence}) Tj ET"
              objects[content_id] = (
                  f"<< /Length {len(stream)} >>\nstream\n{stream}\nendstream"
              )
              objects[page_id] = (
                  f"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 612 792] "
                  f"/Contents {content_id} 0 R "
                  f"/Resources << /Font << /F1 {font_id} 0 R >> >> >>"
              )
          chunks = []
          offsets = [0]
          for number in range(1, max(objects) + 1):
              body = objects[number]
              chunks.append(f"{number} 0 obj\n{body}\nendobj\n")
              offsets.append(offsets[-1] + len(chunks[-1].encode("latin-1")))
          header = "%PDF-1.4\n"
          body = "".join(chunks).encode("latin-1")
          xref_at = len(header) + len(body)
          xref = [f"xref\n0 {len(offsets)}\n", "0000000000 65535 f \n"]
          cursor = len(header)
          for chunk in chunks:
              xref.append(f"{cursor:010d} 00000 n \n")
              cursor += len(chunk.encode("latin-1"))
          trailer = (
              f"trailer<< /Size {len(offsets)} /Root 1 0 R >>\n"
              f"startxref\n{xref_at}\n%%EOF\n"
          )
          pdf = header.encode("latin-1") + body + "".join(xref).encode("latin-1") + trailer.encode("latin-1")
          destination = Path("/tmp/feature-002-four-page.pdf")
          destination.write_bytes(pdf)
          print("pdf_bytes", destination.stat().st_size)
          print("pdf_pages", len(sentences))
          CHK
          uv run pytest \
            tests/unit/test_feature_002_scope.py \
            tests/unit/test_worker_liveness.py \
            tests/unit/test_worker_heartbeat.py \
            tests/unit/test_citation_page_range.py \
            tests/unit/test_retrieval_evidence_floor.py \
            tests/unit/test_nested_fusion_evidence_floor.py \
            tests/unit/test_structural_graph_paths.py \
            tests/unit/test_ingestion_state_machine.py \
            tests/unit/test_graph_stage_warning.py \
            tests/unit/test_release_identity.py \
            tests/unit/test_workflow_heredoc.py \
            tests/evaluation/test_four_page_evidence_floor.py \
            -q

  browser-journey:
    name: DEV browser journey
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 30
    env:
      K8S_INVENTORY: infra/ansible/kubernetes/inventory.ini
      CHECK_REF: ${{ github.event_name == 'pull_request' && github.sha || github.event.client_payload.git_ref || inputs.git_ref || 'dev' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECK_REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Restore shared SSH key from Key Vault
        id: restore_shared_ssh
        uses: ./.github/actions/restore-ssh-key-from-keyvault
        with:
          key-vault-name: ${{ vars.AZURE_KEY_VAULT_NAME }}
          secret-name: ${{ vars.OVH_SSH_PRIVATE_KEY_SECRET_NAME || 'ovh-rag-reinstall-ssh-private-key' }}
          key-path: ${{ vars.OVH_SSH_PRIVATE_KEY_PATH || '~/.ssh/ovh-rag-reinstall-ed25519' }}
      - name: Configure SSH for master
        id: master_ssh
        uses: ./.github/actions/configure-ssh-from-inventory
        with:
          inventory-path: ${{ env.K8S_INVENTORY }}
          inventory-group: master
          ssh-private-key-file: ${{ steps.restore_shared_ssh.outputs.key-path }}
          ssh-user: ubuntu
      - name: Confirm serving digests and load the browser login
        env:
          MASTER_HOST: ${{ steps.master_ssh.outputs.first-host }}
        run: |
          set -euo pipefail
          umask 077
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes "$MASTER_HOST" 'bash -s' > "$RUNNER_TEMP/e2e.env" <<'EOSSH'
          set -euo pipefail
          export KUBECONFIG=/home/ubuntu/.kube/config
          echo "=== serving images ===" >&2
          kubectl -n chatwithdocs-api get deploy api -o jsonpath='api {.spec.template.spec.containers[0].image}{"\n"}' >&2
          kubectl -n chatwithdocs-api get deploy ingestion-worker -o jsonpath='worker {.spec.template.spec.containers[0].image}{"\n"}' >&2
          kubectl -n chatwithdocs-web get deploy web -o jsonpath='web {.spec.template.spec.containers[0].image}{"\n"}' >&2
          kubectl -n argocd get applications.argoproj.io -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status,REV:.status.sync.revision >&2
          api_image=$(kubectl -n chatwithdocs-api get deploy api -o jsonpath='{.spec.template.spec.containers[0].image}')
          worker_image=$(kubectl -n chatwithdocs-api get deploy ingestion-worker -o jsonpath='{.spec.template.spec.containers[0].image}')
          web_image=$(kubectl -n chatwithdocs-web get deploy web -o jsonpath='{.spec.template.spec.containers[0].image}')
          case "$api_image" in
            *sha256:10db1217d63466acfc5ae5084b808917fbe2947ee8fbe4e6ab849806c9048fd6) ;;
            *) echo "unexpected api image" >&2; exit 1 ;;
          esac
          case "$worker_image" in
            *sha256:2ce6ee382c411426ff8f018df508d2506fc5e8734100d5b9b6cf23ce3f114cc8) ;;
            *) echo "unexpected worker image" >&2; exit 1 ;;
          esac
          case "$web_image" in
            *sha256:e77c6685d4e97c57afb1347a82ad6588ee4a3627751ecbd7d36645c9af56db4f) ;;
            *) echo "unexpected web image" >&2; exit 1 ;;
          esac
          pod=$(kubectl -n chatwithdocs-api get pods -l app.kubernetes.io/name=chatwithdocs-api -o jsonpath='{range .items[?(@.status.containerStatuses[0].ready==true)]}{.metadata.name}{"\n"}{end}' | head -n 1)
          echo "ready_pod=${pod}" >&2
          test -n "$pod"
          kubectl -n chatwithdocs-api exec -i "$pod" -- python - <<'PY'
          import shlex
          from pathlib import Path
          env = {}
          for line in Path("/app/.env").read_text().splitlines():
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              env[key] = value
          email = env.get("AUTH_BOOTSTRAP_EMAIL", "").strip()
          password = env.get("AUTH_BOOTSTRAP_PASSWORD", "").strip()
          tenant = env.get("AUTH_BOOTSTRAP_TENANT_KEY", "demo").strip() or "demo"
          if not email or not password:
              raise SystemExit("bootstrap login is unset")
          print("E2E_ADMIN_EMAIL=" + shlex.quote(email))
          print("E2E_ADMIN_PASSWORD=" + shlex.quote(password))
          print("E2E_TENANT_KEY=" + shlex.quote(tenant))
          PY
          EOSSH
          python3 - <<'PY'
          import os
          from pathlib import Path
          text = Path(os.environ["RUNNER_TEMP"], "e2e.env").read_text()
          keys = [line.split("=", 1)[0] for line in text.splitlines() if "=" in line]
          need = {"E2E_ADMIN_EMAIL", "E2E_ADMIN_PASSWORD", "E2E_TENANT_KEY"}
          missing = sorted(need.difference(keys))
          if missing:
              raise SystemExit("missing credential keys: " + ",".join(missing))
          print("credential_keys_present")
          PY
      - name: Install the browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the four-page citation journey
        working-directory: frontend
        env:
          E2E_TARGET: dev
          E2E_BASE_URL: https://chatwithdocs.org
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          source "$RUNNER_TEMP/e2e.env"
          set +a
          npx playwright test e2e/rag-citation.spec.ts
      - name: Read the ingested run, graph result, and worker
        env:
          MASTER_HOST: ${{ steps.master_ssh.outputs.first-host }}
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes "$MASTER_HOST" 'bash -s' <<'EOSSH'
          set -euo pipefail
          export KUBECONFIG=/home/ubuntu/.kube/config
          echo "=== worker ==="
          kubectl -n chatwithdocs-api get pods -l app.kubernetes.io/name=chatwithdocs-worker -o custom-columns=NAME:.metadata.name,READY:.status.containerStatuses[0].ready,RESTARTS:.status.containerStatuses[0].restartCount
          pod=$(kubectl -n chatwithdocs-api get pods -l app.kubernetes.io/name=chatwithdocs-api -o jsonpath='{range .items[?(@.status.containerStatuses[0].ready==true)]}{.metadata.name}{"\n"}{end}' | head -n 1)
          test -n "$pod"
          kubectl -n chatwithdocs-api exec -i "$pod" -- python - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          env = {}
          for line in Path("/app/.env").read_text().splitlines():
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              env[key] = value
          email = env.get("AUTH_BOOTSTRAP_EMAIL", "").strip()
          password = env.get("AUTH_BOOTSTRAP_PASSWORD", "").strip()
          tenant = env.get("AUTH_BOOTSTRAP_TENANT_KEY", "demo").strip() or "demo"

          def call(method, path, body=None, token=None):
              data = None if body is None else json.dumps(body).encode()
              headers = {"Content-Type": "application/json", "X-Tenant-Key": tenant}
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              request = urllib.request.Request(
                  "http://127.0.0.1:8000" + path, data=data, headers=headers, method=method
              )
              with urllib.request.urlopen(request, timeout=120) as response:
                  return json.load(response)

          login = call("POST", "/api/v1/auth/login", {"email": email, "password": password})
          token = login["access_token"]
          listed = call("GET", "/api/v1/documents?limit=50", token=token)
          matches = [
              item for item in listed.get("items", [])
              if str(item.get("title", "")).startswith("citrine-serum-")
          ]
          if not matches:
              raise SystemExit("no citrine-serum document")
          document = matches[0]
          document_id = document["document_id"]
          runs = call("GET", f"/api/v1/documents/{document_id}/ingestion-runs", token=token)
          run_id = runs["ingestion_run_ids"][0]
          run = call("GET", f"/api/v1/ingestion-runs/{run_id}", token=token)
          query = call(
              "POST",
              "/api/v1/query",
              {
                  "question": "What does page two say about ceramide?",
                  "document_ids": [document_id],
                  "include_graph_paths": True,
                  "interaction_mode": "search",
              },
              token=token,
          )
          stages = {item["stage"]: item["status"] for item in run.get("stages", [])}
          citations = query.get("citations") or []
          print(json.dumps({
              "document_id": document_id,
              "document_status": document.get("status"),
              "run_status": run.get("status"),
              "latest_warning": run.get("latest_warning"),
              "heartbeat_at": run.get("heartbeat_at"),
              "stages": stages,
              "citation_pages": [
                  [item.get("document_id"), item.get("page_start"), item.get("page_end")]
                  for item in citations
              ],
              "graph_path_count": len(query.get("graph_paths") or []),
              "graph_path_kinds": [item.get("path_kind") for item in (query.get("graph_paths") or [])],
              "warnings": query.get("warnings") or [],
          }, default=str))
          required = ["PARSE", "CHUNK", "EMBED", "INDEX_VECTOR", "INDEX_GRAPH"]
          bad = [name for name in required if stages.get(name) not in {"completed", "completed_with_warnings"}]
          if bad:
              raise SystemExit("stages not completed: " + ",".join(bad))
          if run.get("status") not in {"completed", "completed_with_warnings"}:
              raise SystemExit("run status " + str(run.get("status")))
          if not run.get("heartbeat_at"):
              raise SystemExit("missing heartbeat")
          if run.get("latest_warning") == "community summarization disabled":
              raise SystemExit("skip was recorded as a warning")
          if not citations or any(item.get("document_id") != document_id for item in citations):
              raise SystemExit("citation document isolation failed")
          if not any(
              isinstance(item.get("page_start"), int) and isinstance(item.get("page_end"), int)
              and item["page_start"] <= 2 <= item["page_end"]
              for item in citations
          ):
              raise SystemExit("page 2 citation missing")
          print("dev_acceptance_checks_passed")
          PY
          EOSSH
