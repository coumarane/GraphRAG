name: Deploy Kubernetes Cluster

on:
  workflow_dispatch:
    inputs:
      run_install_tools:
        description: "Run install_packages_playbook.yml to install cluster tools (Helm, etc.)"
        required: true
        default: true
        type: boolean
      # allow_registry_patch:
      #   description: "Patch containerd/kubelet on master to allow HTTP pulls from Harbor"
      #   required: false
      #   default: false
      #   type: boolean

env:
  ANSIBLE_HOST_KEY_CHECKING: "False"
  K8S_INVENTORY: infra/ansible/kubernetes/inventory.ini

jobs:
  deploy:
    name: Run Kubernetes Ansible Playbooks
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip install ansible

      - name: Install required Ansible collections
        run: |
          ansible-galaxy collection install kubernetes.core

      - name: Configure SSH keys for Ansible
        env:
          # Prefer K8S_SSH_PRIVATE_KEY, but fall back to existing K8S_MASTER_SSH_PRIVATE_KEY if present
          SSH_MASTER_PRIVATE_KEY: ${{ secrets.K8S_SSH_PRIVATE_KEY || secrets.K8S_MASTER_SSH_PRIVATE_KEY }}
          SSH_WORKER_PRIVATE_KEY: ${{ secrets.K8S_WORKER_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          if [ -z "$SSH_MASTER_PRIVATE_KEY" ]; then
            echo "Secret K8S_SSH_PRIVATE_KEY (or K8S_MASTER_SSH_PRIVATE_KEY) is missing. Add the private SSH key for the Kubernetes master nodes to repository secrets."
            exit 1
          fi
          if [ -z "$SSH_WORKER_PRIVATE_KEY" ]; then
            echo "Secret K8S_WORKER_SSH_PRIVATE_KEY is missing. Add the private SSH key for the Kubernetes worker nodes to repository secrets."
            exit 1
          fi

          mkdir -p ~/.ssh
          MASTER_KEY_PATH="$HOME/.ssh/k8s_master"
          WORKER_KEY_PATH="$HOME/.ssh/k8s_worker"

          normalize_and_write_key() {
            key_data="$1"
            path="$2"
            if printf '%s' "$key_data" | grep -qE "BEGIN (OPENSSH|RSA|DSA|EC) PRIVATE KEY"; then
              printf '%s' "$key_data" | tr -d '\r' | sed 's/\\n/\n/g' > "$path"
            else
              if ! printf '%s' "$key_data" | base64 -d > "$path" 2>/dev/null; then
                echo "Unable to parse SSH key for $path (neither plain text nor base64)."
                exit 1
              fi
            fi
            chmod 600 "$path"
            if ! ssh-keygen -y -f "$path" >/dev/null 2>&1; then
              echo "SSH private key at $path is not readable (likely malformed or encrypted). Provide an unencrypted key."
              exit 1
            fi
          }

          normalize_and_write_key "$SSH_MASTER_PRIVATE_KEY" "$MASTER_KEY_PATH"
          normalize_and_write_key "$SSH_WORKER_PRIVATE_KEY" "$WORKER_KEY_PATH"

          MASTER_HOSTS=$(awk '
            /^\[master\]/{flag=1; next}
            /^\[/{flag=0}
            flag && /^[0-9]/{print $1}
          ' "${K8S_INVENTORY}" | tr '\n' ' ')

          WORKER_HOSTS=$(awk '
            /^\[worker\]/{flag=1; next}
            /^\[/{flag=0}
            flag && /^[0-9]/{print $1}
          ' "${K8S_INVENTORY}" | tr '\n' ' ')

          # SSH config with host-specific keys
          {
            echo "Host *"
            echo "  User ubuntu"
            echo "  StrictHostKeyChecking no"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
            echo "  IdentitiesOnly yes"
            for h in $MASTER_HOSTS; do
              echo "Host $h"
              echo "  IdentityFile $MASTER_KEY_PATH"
              echo "MASTER_HOST=$h" >> "$GITHUB_ENV"
            done
            for h in $WORKER_HOSTS; do
              echo "Host $h"
              echo "  IdentityFile $WORKER_KEY_PATH"
            done
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

          INVENTORY_HOSTS=$(awk '/^[0-9]/{print $1}' "${K8S_INVENTORY}" | tr '\n' ' ')
          if [ -n "$INVENTORY_HOSTS" ]; then
            ssh-keyscan -T 10 -H $INVENTORY_HOSTS >> ~/.ssh/known_hosts || true
          fi
      - name: Verify SSH connectivity to primary host
        run: |
          HOSTS=$(awk '/^[0-9]/{print $1}' "${K8S_INVENTORY}")
          for h in $HOSTS; do
            ssh -o BatchMode=yes "$h" "echo SSH_OK from $h"
          done

      - name: Provision Kubernetes control plane and workers
        run: ansible-playbook infra/ansible/kubernetes/playbook.yml -i "${K8S_INVENTORY}" -u ubuntu

      - name: Install Kubernetes tools (Helm)
        if: inputs.run_install_tools == true
        run: ansible-playbook infra/ansible/kubernetes/install_packages_playbook.yml -i "${K8S_INVENTORY}" -u ubuntu

