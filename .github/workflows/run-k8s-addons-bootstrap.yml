name: Run Kubernetes Add-ons Bootstrap

on:
  workflow_dispatch:
    inputs:
      install_cilium:
        description: "Install/upgrade Cilium (only if you actually use Cilium as CNI)"
        required: true
        default: true
        type: boolean
      install_metallb:
        description: "Install/upgrade MetalLB"
        required: true
        default: true
        type: boolean
      install_cert_manager:
        description: "Install/upgrade cert-manager + ClusterIssuer"
        required: true
        default: true
        type: boolean
      install_envoy_gateway:
        description: "Install/upgrade Envoy Gateway"
        required: true
        default: true
        type: boolean
      install_azure_keyvault_csi:
        description: "Install/upgrade Secrets Store CSI Driver + Azure Key Vault provider"
        required: true
        default: true
        type: boolean
      install_prometheus:
        description: "Install/upgrade Prometheus + Grafana stack"
        required: true
        default: true
        type: boolean
      install_argocd:
        description: "Install/upgrade Argo CD"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  id-token: write

env:
  K8S_INVENTORY: infra/ansible/kubernetes/inventory.ini

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ansible
        uses: ./.github/actions/setup-ansible
        with:
          collections: kubernetes.core

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Restore shared SSH key from Key Vault
        id: restore_shared_ssh
        uses: ./.github/actions/restore-ssh-key-from-keyvault
        with:
          key-vault-name: ${{ vars.AZURE_KEY_VAULT_NAME }}
          secret-name: ${{ vars.OVH_SSH_PRIVATE_KEY_SECRET_NAME || 'ovh-rag-reinstall-ssh-private-key' }}
          key-path: ${{ vars.OVH_SSH_PRIVATE_KEY_PATH || '~/.ssh/ovh-rag-reinstall-ed25519' }}

      - name: Configure SSH for master
        id: master_ssh
        uses: ./.github/actions/configure-ssh-from-inventory
        with:
          inventory-path: ${{ env.K8S_INVENTORY }}
          inventory-group: master
          ssh-private-key-file: ${{ steps.restore_shared_ssh.outputs.key-path }}
          ssh-user: ubuntu

      - name: Export master host
        run: echo "MASTER_HOST=${{ steps.master_ssh.outputs.first-host }}" >> "$GITHUB_ENV"

      - name: Copy Helm values and k8s manifests to master
        run: |
          set -euo pipefail
          ssh "$MASTER_HOST" "mkdir -p /tmp/k8s-addons/helm /tmp/k8s-addons/k8s /tmp/k8s-addons/argocd"

          # Helm values
          scp infra/helm/cert-manager/values.yaml     "${MASTER_HOST}:/tmp/k8s-addons/helm/cert-manager-values.yaml"
          scp infra/helm/envoy-gateway/values.yaml    "${MASTER_HOST}:/tmp/k8s-addons/helm/envoy-gateway-values.yaml"
          scp infra/helm/cilium/values.yaml           "${MASTER_HOST}:/tmp/k8s-addons/helm/cilium-values.yaml"
          scp infra/helm/metallb/values.yaml          "${MASTER_HOST}:/tmp/k8s-addons/helm/metallb-values.yaml"
          scp infra/helm/elasticsearch/values.yaml    "${MASTER_HOST}:/tmp/k8s-addons/helm/elasticsearch-values.yaml"
          scp infra/helm/kibana/values.yaml           "${MASTER_HOST}:/tmp/k8s-addons/helm/kibana-values.yaml"
          scp infra/helm/prometheus-stack/values.yaml "${MASTER_HOST}:/tmp/k8s-addons/helm/prometheus-stack-values.yaml"

          # Raw k8s manifests
          scp infra/k8s/cert-manager/clusterissuer-letsencrypt-prod.yaml \
            "${MASTER_HOST}:/tmp/k8s-addons/k8s/clusterissuer-letsencrypt-prod.yaml"
          scp infra/helm/metallb/ipaddresspool.yaml \
            "${MASTER_HOST}:/tmp/k8s-addons/k8s/metallb-ipaddresspool.yaml"
          scp infra/k8s/monitoring/grafana-httproute.yaml \
            "${MASTER_HOST}:/tmp/k8s-addons/k8s/grafana-httproute.yaml"
          scp infra/k8s/gateway/envoy-gatewayclass.yaml \
            "${MASTER_HOST}:/tmp/k8s-addons/k8s/envoy-gatewayclass.yaml"
          scp infra/k8s/gateway/envoyproxy-public-gateway.yaml \
            "${MASTER_HOST}:/tmp/k8s-addons/k8s/envoyproxy-public-gateway.yaml"
          scp infra/k8s/gateway/shared-gateway.yaml \
            "${MASTER_HOST}:/tmp/k8s-addons/k8s/shared-gateway.yaml"

          # Argo CD core bundle
          scp infra/argocd/kustomization.yaml "${MASTER_HOST}:/tmp/k8s-addons/argocd/kustomization.yaml"
          scp infra/argocd/namespace.yaml "${MASTER_HOST}:/tmp/k8s-addons/argocd/namespace.yaml"
          scp infra/argocd/httproute.yaml "${MASTER_HOST}:/tmp/k8s-addons/argocd/httproute.yaml"
          scp -r infra/argocd/patches "${MASTER_HOST}:/tmp/k8s-addons/argocd/"

      - name: Prepare kubectl/helm access on master (ubuntu kubeconfig)
        run: |
          set -euo pipefail
          ssh "$MASTER_HOST" bash -s <<'EOSSH'
          set -euo pipefail

          # Make kubeconfig readable by ubuntu user
          sudo mkdir -p /home/ubuntu/.kube
          sudo cp /etc/kubernetes/admin.conf /home/ubuntu/.kube/config
          sudo chown -R ubuntu:ubuntu /home/ubuntu/.kube
          chmod 600 /home/ubuntu/.kube/config

          # Install tooling if missing
          command -v curl >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y curl)

          command -v helm >/dev/null 2>&1 || {
            export DESIRED_VERSION=v4.2.3
            curl -fsSL https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          }

          command -v kubectl >/dev/null 2>&1 || {
            sudo apt-get update
            sudo apt-get install -y kubectl
          }

          # Basic connectivity check
          export KUBECONFIG=/home/ubuntu/.kube/config
          kubectl version --client=true -o yaml
          kubectl get nodes
          EOSSH

      - name: Install/upgrade Cilium
        if: inputs.install_cilium == true
        run: |
          set -euo pipefail
          ssh "$MASTER_HOST" bash -s <<'EOSSH'
          set -euo pipefail
          export KUBECONFIG=/home/ubuntu/.kube/config

          helm repo add cilium https://helm.cilium.io
          helm repo update
          helm upgrade --install cilium cilium/cilium \
            --namespace kube-system \
            -f /tmp/k8s-addons/helm/cilium-values.yaml

          kubectl -n kube-system rollout status ds/cilium --timeout=600s
          EOSSH

      - name: Install/upgrade MetalLB
        if: inputs.install_metallb == true
        run: |
          set -euo pipefail
          ssh "$MASTER_HOST" bash -s <<'EOSSH'
          set -euo pipefail
          export KUBECONFIG=/home/ubuntu/.kube/config

          helm repo add metallb https://metallb.github.io/metallb
          helm repo update

          STATUS=$(helm status metallb -n metallb-system --output json 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin).get('info',{}).get('status',''))" 2>/dev/null || echo "")
          if [ "${STATUS:-}" != "" ] && echo "$STATUS" | grep -qi "^pending"; then
            echo "Helm release 'metallb' is in pending state ($STATUS); uninstalling to clear the lock."
            helm uninstall metallb -n metallb-system || true
          fi

          helm upgrade --install metallb metallb/metallb \
            -n metallb-system --create-namespace \
            -f /tmp/k8s-addons/helm/metallb-values.yaml \
            --wait --timeout 10m0s --atomic --wait-for-jobs

          # Apply IPAddressPool / L2Advertisement
          kubectl apply -f /tmp/k8s-addons/k8s/metallb-ipaddresspool.yaml
          EOSSH

      - name: Install/upgrade cert-manager (with CRDs)
        if: inputs.install_cert_manager == true
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes "$MASTER_HOST" bash -s <<'EOSSH'
          set -euo pipefail
          export KUBECONFIG=/home/ubuntu/.kube/config

          helm repo add jetstack https://charts.jetstack.io
          helm repo update

          # Clear any pending Helm operation lock before upgrading
          STATUS=$(helm status cert-manager -n cert-manager --output json 2>/dev/null | python3 -c "import json,sys; import sys; import json; data=json.load(sys.stdin); print(data.get('info',{}).get('status',''))" 2>/dev/null || echo "")
          if [ "${STATUS:-}" != "" ] && echo "$STATUS" | grep -qi "^pending"; then
            echo "Helm release 'cert-manager' is in pending state ($STATUS); uninstalling to clear the lock."
            helm uninstall cert-manager -n cert-manager || true
          fi

          # Ensure CRDs exist (either in values.yaml or via --set installCRDs=true)
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager --create-namespace \
            --set installCRDs=true --wait --timeout 15m0s \
            -f /tmp/k8s-addons/helm/cert-manager-values.yaml

          kubectl -n cert-manager rollout status deployment/cert-manager-webhook --timeout=600s
          kubectl -n cert-manager rollout status deployment/cert-manager --timeout=600s
          kubectl -n cert-manager rollout status deployment/cert-manager-cainjector --timeout=600s
          EOSSH

      - name: Configure Cloudflare secret + Let’s Encrypt ClusterIssuer
        if: inputs.install_cert_manager == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing secret CLOUDFLARE_API_TOKEN."
            exit 1
          fi

          ssh "$MASTER_HOST" "CLOUDFLARE_API_TOKEN='${CLOUDFLARE_API_TOKEN}' bash -s" <<'EOSSH'
          set -euo pipefail
          export KUBECONFIG=/home/ubuntu/.kube/config

          # Create/update Cloudflare API token secret
          kubectl -n cert-manager create secret generic cloudflare-api-token-secret \
            --from-literal=api-token="${CLOUDFLARE_API_TOKEN}" \
            --dry-run=client -o yaml | kubectl apply -f -

          # Apply ClusterIssuer
          kubectl apply -f /tmp/k8s-addons/k8s/clusterissuer-letsencrypt-prod.yaml

          kubectl get clusterissuer letsencrypt-prod
          EOSSH

      - name: Install/upgrade Envoy Gateway
        if: inputs.install_envoy_gateway == true
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes "$MASTER_HOST" bash -s <<'EOSSH'
          set -euo pipefail
          export KUBECONFIG=/home/ubuntu/.kube/config

          helm upgrade --install eg oci://docker.io/envoyproxy/gateway-helm \
            --version v1.8.3 \
            --namespace envoy-gateway-system \
            --create-namespace \
            -f /tmp/k8s-addons/helm/envoy-gateway-values.yaml

          kubectl wait --timeout=10m -n envoy-gateway-system deployment/envoy-gateway --for=condition=Available

          kubectl apply -f /tmp/k8s-addons/k8s/envoyproxy-public-gateway.yaml
          kubectl apply -f /tmp/k8s-addons/k8s/envoy-gatewayclass.yaml
          kubectl apply -f /tmp/k8s-addons/k8s/shared-gateway.yaml

          kubectl get gatewayclass eg
          kubectl -n envoy-gateway-system get envoyproxy public-gateway-config
          kubectl -n envoy-gateway-system get gateway public-gateway
          kubectl -n envoy-gateway-system get svc
          kubectl get certificate -A || true
          EOSSH

      - name: Install/upgrade Azure Key Vault CSI provider
        if: inputs.install_azure_keyvault_csi == true
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes "$MASTER_HOST" bash -s <<'EOSSH'
          set -euo pipefail
          export KUBECONFIG=/home/ubuntu/.kube/config

          helm repo add csi-secrets-store-provider-azure https://azure.github.io/secrets-store-csi-driver-provider-azure/charts
          helm repo update

          helm upgrade --install akv-secrets-provider csi-secrets-store-provider-azure/csi-secrets-store-provider-azure \
            --namespace kube-system \
            --wait --timeout 10m0s --atomic

          kubectl get crd secretproviderclasses.secrets-store.csi.x-k8s.io
          kubectl -n kube-system wait --for=condition=ready pod -l app=secrets-store-csi-driver --timeout=600s
          kubectl -n kube-system wait --for=condition=ready pod -l app=csi-secrets-store-provider-azure --timeout=600s
          EOSSH

      # - name: Install/upgrade Elasticsearch + Kibana
      #   run: |
      #     set -euo pipefail
      #     ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes "$MASTER_HOST" bash -s <<'EOSSH'
      #     set -euo pipefail
      #     export KUBECONFIG=/home/ubuntu/.kube/config

      #     helm repo add elastic https://helm.elastic.co
      #     helm repo update

      #     for release in elasticsearch kibana; do
      #       STATUS=$(helm status "$release" -n observability --output json 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin).get('info',{}).get('status',''))" 2>/dev/null || echo "")
      #       if [ "${STATUS:-}" != "" ] && echo "$STATUS" | grep -qi "^pending"; then
      #         echo "Helm release '$release' is in pending state ($STATUS); uninstalling to clear the lock."
      #         helm uninstall "$release" -n observability || true
      #       fi
      #     done

      #     helm upgrade --install elasticsearch elastic/elasticsearch \
      #       -n observability --create-namespace \
      #       -f /tmp/k8s-addons/helm/elasticsearch-values.yaml \
      #       --wait --timeout 20m0s --atomic --wait-for-jobs

      #     helm upgrade --install kibana elastic/kibana \
      #       -n observability \
      #       -f /tmp/k8s-addons/helm/kibana-values.yaml \
      #       --wait --timeout 10m0s --atomic --wait-for-jobs

      #     kubectl -n observability rollout status statefulset/elasticsearch-master --timeout=900s
      #     kubectl -n observability rollout status deployment -l app.kubernetes.io/name=kibana --timeout=600s
      #     kubectl -n observability get svc
      #     EOSSH

      - name: Install/upgrade Prometheus stack
        if: inputs.install_prometheus == true
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${GRAFANA_ADMIN_PASSWORD:-}" ]; then
            echo "Missing secret GRAFANA_ADMIN_PASSWORD."
            exit 1
          fi

          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes "$MASTER_HOST" \
            "GRAFANA_ADMIN_PASSWORD='${GRAFANA_ADMIN_PASSWORD}' bash -s" <<'EOSSH'
          set -euo pipefail
          export KUBECONFIG=/home/ubuntu/.kube/config

          if ! kubectl get gatewayclass eg >/dev/null 2>&1; then
            echo "Envoy Gateway is not installed. Install it before applying Grafana HTTPRoute."
            exit 1
          fi

          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

          STATUS=$(helm status kube-prometheus-stack -n monitoring --output json 2>/dev/null | python3 -c "import json,sys; print(json.load(sys.stdin).get('info',{}).get('status',''))" 2>/dev/null || echo "")
          if [ "${STATUS:-}" != "" ] && echo "$STATUS" | grep -qi "^pending"; then
            echo "Helm release 'kube-prometheus-stack' is in pending state ($STATUS); uninstalling to clear the lock."
            helm uninstall kube-prometheus-stack -n monitoring || true
          fi

          helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
            -n monitoring --create-namespace \
            -f /tmp/k8s-addons/helm/prometheus-stack-values.yaml \
            --set-string grafana.adminPassword="${GRAFANA_ADMIN_PASSWORD}" \
            --wait --timeout 15m0s --atomic --wait-for-jobs

          kubectl apply -f /tmp/k8s-addons/k8s/grafana-httproute.yaml

          kubectl -n monitoring rollout status deployment/kube-prometheus-stack-operator --timeout=600s
          kubectl -n monitoring rollout status statefulset/alertmanager-kube-prometheus-stack-alertmanager --timeout=600s
          kubectl -n monitoring rollout status statefulset/prometheus-kube-prometheus-stack-prometheus --timeout=900s
          kubectl -n monitoring rollout status deployment/kube-prometheus-stack-grafana --timeout=600s
          kubectl -n monitoring get svc
          EOSSH

      - name: Install/upgrade Argo CD (kustomize)
        if: inputs.install_argocd == true
        env:
          ARGOCD_GITHUB_APP_ID: ${{ secrets.ARGOCD_GITHUB_APP_ID }}
          ARGOCD_GITHUB_APP_INSTALLATION_ID: ${{ secrets.ARGOCD_GITHUB_APP_INSTALLATION_ID }}
          ARGOCD_GITHUB_APP_PRIVATE_KEY: ${{ secrets.ARGOCD_GITHUB_APP_PRIVATE_KEY }}
        run: |
          set -euo pipefail

          REPO_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

          # Base64-encode key safely (single line)
          KEY_B64="$(printf '%s' "${ARGOCD_GITHUB_APP_PRIVATE_KEY}" | tr -d '\r' | base64 -w0)"

          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes "$MASTER_HOST" \
            "ARGOCD_GITHUB_APP_ID='${ARGOCD_GITHUB_APP_ID}' \
            ARGOCD_GITHUB_APP_INSTALLATION_ID='${ARGOCD_GITHUB_APP_INSTALLATION_ID}' \
            KEY_B64='${KEY_B64}' \
            REPO_URL='${REPO_URL}' bash -s" <<'EOSSH'
          set -euo pipefail
          export KUBECONFIG=/home/ubuntu/.kube/config

          if ! kubectl get gatewayclass eg >/dev/null 2>&1; then
            echo "Envoy Gateway is not installed. Install it before applying Argo CD HTTPRoute."
            exit 1
          fi

          kubectl get namespace argocd >/dev/null 2>&1 || kubectl create namespace argocd

          kubectl apply --server-side -k /tmp/k8s-addons/argocd

          kubectl wait --for=condition=Established --timeout=300s \
            crd/applications.argoproj.io \
            crd/applicationsets.argoproj.io \
            crd/appprojects.argoproj.io

          # Reconstruct PEM key exactly
          KEY_CONTENT="$(printf '%s' "$KEY_B64" | base64 -d)"

          # Apply repo secret (correct YAML + correct key names)
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: repo-github-chatwithdocs
            namespace: argocd
            labels:
              argocd.argoproj.io/secret-type: repository
          type: Opaque
          stringData:
            url: "${REPO_URL}"
            type: git
            githubAppID: "${ARGOCD_GITHUB_APP_ID}"
            githubAppInstallationID: "${ARGOCD_GITHUB_APP_INSTALLATION_ID}"
            githubAppPrivateKey: |
          $(printf '%s\n' "$KEY_CONTENT" | sed 's/^/    /')
          EOF

          kubectl -n argocd rollout status deployment/argocd-repo-server --timeout=600s
          kubectl -n argocd logs deployment/argocd-repo-server --since=5m | tail -200
          kubectl -n argocd get secret argocd-initial-admin-secret >/dev/null 2>&1 && \
            echo "Argo CD initial admin secret is available in secret/argocd-initial-admin-secret."
          EOSSH

      - name: Post-check
        run: |
          set -euo pipefail
          ssh "$MASTER_HOST" bash -s <<'EOSSH'
          set -euo pipefail
          export KUBECONFIG=/home/ubuntu/.kube/config

          echo "=== Nodes ==="
          kubectl get nodes -o wide

          echo "=== cert-manager ==="
          kubectl -n cert-manager get pods

          echo "=== ClusterIssuers ==="
          kubectl get clusterissuer

          echo "=== certificates ==="
          kubectl get certificate,certificaterequest,order,challenge -A || true

          echo "=== envoy gateway ==="
          kubectl get gatewayclass
          kubectl -n envoy-gateway-system get gateway
          kubectl get httproute -A
          kubectl -n envoy-gateway-system get svc
          kubectl -n envoy-gateway-system get pods

          echo "=== observability (elasticsearch/kibana) ==="
          kubectl -n observability get svc
          kubectl -n observability get pods

          echo "=== monitoring (kube-prometheus-stack) ==="
          if kubectl get ns monitoring >/dev/null 2>&1; then
            kubectl -n monitoring get svc
            kubectl -n monitoring get pods
          else
            echo "monitoring namespace not present (skipped)."
          fi

          echo "=== argocd ==="
          if kubectl get ns argocd >/dev/null 2>&1; then
            kubectl -n argocd get svc
            kubectl -n argocd get pods
          else
            echo "argocd namespace not present (skipped)."
          fi
          EOSSH
