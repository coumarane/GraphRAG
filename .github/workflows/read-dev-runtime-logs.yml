name: Read DEV runtime logs

on:
  workflow_dispatch:
  repository_dispatch:
    types: [read-dev-runtime-logs]

permissions:
  contents: read
  id-token: write

env:
  K8S_INVENTORY: infra/ansible/kubernetes/inventory.ini

jobs:
  read:
    name: Read runtime evidence
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Restore shared SSH key from Key Vault
        id: restore_shared_ssh
        uses: ./.github/actions/restore-ssh-key-from-keyvault
        with:
          key-vault-name: ${{ vars.AZURE_KEY_VAULT_NAME }}
          secret-name: ${{ vars.OVH_SSH_PRIVATE_KEY_SECRET_NAME || 'ovh-rag-reinstall-ssh-private-key' }}
          key-path: ${{ vars.OVH_SSH_PRIVATE_KEY_PATH || '~/.ssh/ovh-rag-reinstall-ed25519' }}

      - name: Configure SSH for master
        id: master_ssh
        uses: ./.github/actions/configure-ssh-from-inventory
        with:
          inventory-path: ${{ env.K8S_INVENTORY }}
          inventory-group: master
          ssh-private-key-file: ${{ steps.restore_shared_ssh.outputs.key-path }}
          ssh-user: ubuntu

      - name: Read search error and worker crash
        env:
          MASTER_HOST: ${{ steps.master_ssh.outputs.first-host }}
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes "$MASTER_HOST" 'bash -s' <<'EOSSH'
          set -euo pipefail
          export KUBECONFIG=/home/ubuntu/.kube/config
          echo "=== argo ==="
          kubectl -n argocd get applications.argoproj.io -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status,REV:.status.sync.revision
          echo "=== pods ==="
          kubectl -n chatwithdocs-api get pods -o jsonpath='{range .items[*]}{.metadata.name}{" ready="}{.status.containerStatuses[0].ready}{" restarts="}{.status.containerStatuses[0].restartCount}{" reason="}{.status.containerStatuses[0].lastState.terminated.reason}{" exit="}{.status.containerStatuses[0].lastState.terminated.exitCode}{" finished="}{.status.containerStatuses[0].lastState.terminated.finishedAt}{" started="}{.status.containerStatuses[0].state.running.startedAt}{"\n"}{end}'
          echo
          echo "=== images ==="
          kubectl -n chatwithdocs-api get deploy api -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
          kubectl -n chatwithdocs-api get deploy ingestion-worker -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
          kubectl -n chatwithdocs-web get deploy web -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
          echo "=== worker log tail ==="
          kubectl -n chatwithdocs-api logs deploy/ingestion-worker --tail=400 | sed -E "s/as '[^']*'/as '<redacted>'/g; s#rediss?://[^ ]*#redis://<redacted>#g" | grep -vE 'File "|site-packages|azure/' | tail -n 50 || true
          pod=$(kubectl -n chatwithdocs-api get pods -l app.kubernetes.io/name=chatwithdocs-api -o jsonpath='{range .items[?(@.status.containerStatuses[0].ready==true)]}{.metadata.name}{"\n"}{end}' | head -n 1)
          echo "pod=${pod}"
          kubectl -n chatwithdocs-api exec -i "$pod" -- python - <<'PY'
          import json
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path
          env = {}
          for line in Path("/app/.env").read_text().splitlines():
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              env[key] = value
          email = env.get("AUTH_BOOTSTRAP_EMAIL", "").strip()
          password = env.get("AUTH_BOOTSTRAP_PASSWORD", "").strip()
          tenant = env.get("AUTH_BOOTSTRAP_TENANT_KEY", "demo").strip() or "demo"

          def redact(value):
              text = str(value).replace("\n", " ")
              text = re.sub(r"(?i)(password|sig|access_token|authorization)=[^&\s\"]+", r"\1=redacted", text)
              text = re.sub(r"rediss?://\S+", "redis://redacted", text)
              text = re.sub(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}", "<email>", text)
              return text[:240]

          def request(method, url, payload=None, headers=None):
              data = None if payload is None else json.dumps(payload).encode()
              req = urllib.request.Request(url, data=data, method=method)
              for key, value in (headers or {}).items():
                  req.add_header(key, value)
              if payload is not None:
                  req.add_header("content-type", "application/json")
              try:
                  with urllib.request.urlopen(req, timeout=90) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()

          status, body = request("POST", "http://127.0.0.1:8000/api/v1/auth/login", {"email": email, "password": password})
          print("login", status)
          token = json.loads(body)["access_token"]
          auth = {"Authorization": "Bearer " + token, "X-Tenant-Key": tenant}
          status, raw = request(
              "POST",
              "http://127.0.0.1:8000/api/v1/retrieval/search",
              {"question": "rollout-001", "top_k": 3},
              auth,
          )
          payload = json.loads(raw)
          print("search_http", status)
          print("search_code", payload.get("code"))
          print("search_error_type", (payload.get("metadata") or {}).get("error_type"))
          print("search_evidence", len(payload.get("evidence") or []))
          status, raw = request("GET", "http://127.0.0.1:8000/api/v1/documents?limit=30", headers=auth)
          listed = json.loads(raw) if status == 200 else {}
          print("documents_http", status, "count", len(listed.get("items") or []) if isinstance(listed, dict) else 0)
          for item in (listed.get("items") or []) if isinstance(listed, dict) else []:
              title = str(item.get("title") or "")
              if not title.startswith("citrine-serum"):
                  continue
              did = item.get("document_id") or item.get("id")
              print("serum_doc", did, item.get("status"), title[:48])
              st, raw2 = request("GET", "http://127.0.0.1:8000/api/v1/documents/" + str(did) + "/ingestion-runs/latest", headers=auth)
              latest = json.loads(raw2) if st == 200 else {}
              print(
                  "serum_run", st,
                  "status", latest.get("status") if isinstance(latest, dict) else None,
                  "progress", latest.get("progress_state") if isinstance(latest, dict) else None,
                  "stage", latest.get("current_stage") if isinstance(latest, dict) else None,
                  "parser", latest.get("parser_used") if isinstance(latest, dict) else None,
                  "warning", redact(latest.get("latest_warning") or "") if isinstance(latest, dict) else "",
                  "error", redact(latest.get("error_message") or "") if isinstance(latest, dict) else "",
              )
              for stage in (latest.get("stages") or []) if isinstance(latest, dict) else []:
                  print("serum_stage", stage.get("stage"), stage.get("status"), redact(stage.get("error_message") or ""))
          DOC = "01a19bcc-5666-7174-8c64-d751bfa710f7"
          status, raw = request("GET", "http://127.0.0.1:8000/api/v1/documents/" + DOC, headers=auth)
          doc = json.loads(raw) if status == 200 else {}
          print(
              "citrine_document_http", status,
              "status", doc.get("status") if isinstance(doc, dict) else None,
              "title", doc.get("title") if isinstance(doc, dict) else None,
              "failed_stage", doc.get("failed_stage") if isinstance(doc, dict) else None,
              "failure", redact(doc.get("failure_reason") or "") if isinstance(doc, dict) else "",
          )
          status, raw = request("GET", "http://127.0.0.1:8000/api/v1/documents/" + DOC + "/ingestion-runs/latest", headers=auth)
          run = json.loads(raw) if status == 200 else {}
          print("citrine_run_http", status, "run", run.get("status"), "stage", run.get("current_stage"), "parser", run.get("parser_used"), "error", redact(run.get("error_message") or ""))
          for stage in run.get("stages") or []:
              if stage.get("stage") in {"PARSE", "CHUNK", "EMBED", "INDEX_VECTOR", "EXTRACT_GRAPH", "INDEX_GRAPH", "FINALIZE"} or stage.get("status") in {"failed", "completed_with_warnings"}:
                  print("citrine_stage", stage.get("stage"), stage.get("status"), "attempts", stage.get("attempt_count"), "error", redact(stage.get("error_message") or ""))
          status, raw = request("GET", "http://127.0.0.1:8000/api/v1/documents/" + DOC + "/chunks?limit=1", headers=auth)
          chunks = json.loads(raw) if status == 200 else {}
          print("citrine_chunks_http", status, "total", chunks.get("total") if isinstance(chunks, dict) else None)
          status, raw = request("POST", "http://127.0.0.1:8000/api/v1/retrieval/search", {"question": "Feature001CitrineHarbor", "document_ids": [DOC], "top_k": 5}, auth)
          search = json.loads(raw) if status == 200 else {}
          evidence = search.get("evidence") or [] if isinstance(search, dict) else []
          ids = sorted({str(item.get("document_id")) for item in evidence})
          print("citrine_search_http", status, "evidence", len(evidence), "ids", ",".join(ids) if ids else "none", "phrase", any("Feature001CitrineHarbor" in str(item.get("text") or "") for item in evidence), "warnings", ",".join(search.get("warnings") or []) if isinstance(search, dict) else "")
          try:
              import redis

              client = redis.Redis.from_url(env.get("REDIS_URL", ""), socket_timeout=5)
              print("redis_ping", bool(client.ping()))
              for key in ("ingestion-jobs", "ingestion-dlq"):
                  print("redis_xlen", key, int(client.xlen(key)))
              info = client.xpending("ingestion-jobs", "ingestion-workers")
              pending = info.get("pending") if isinstance(info, dict) else (info[0] if info else None)
              print("redis_jobs_pending", pending)
              entries = client.xpending_range("ingestion-jobs", "ingestion-workers", "-", "+", 5)
              print("redis_pending_entries", len(entries))
              for entry in entries:
                  idle = entry.get("time_since_delivered") if isinstance(entry, dict) else None
                  times = entry.get("times_delivered") if isinstance(entry, dict) else None
                  message_id = entry.get("message_id") if isinstance(entry, dict) else None
                  print("redis_pending_entry", "idle_ms", idle, "deliveries", times)
                  if not message_id:
                      continue
                  for _item_id, fields in client.xrange("ingestion-jobs", min=message_id, max=message_id, count=1):
                      raw_payload = fields.get(b"payload") or fields.get("payload") or b"{}"
                      if isinstance(raw_payload, bytes):
                          raw_payload = raw_payload.decode("utf-8", "replace")
                      job = json.loads(raw_payload)
                      print("redis_pending_job", "run", job.get("ingestion_run_id"), "document", job.get("document_id"))
          except Exception as exc:
              print("redis_error", type(exc).__name__, redact(exc))
          PY
          EOSSH
