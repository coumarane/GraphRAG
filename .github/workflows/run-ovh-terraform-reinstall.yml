name: Run OVH Terraform Reinstall

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Terraform operation to run
        required: true
        default: plan
        type: choice
        options:
          - plan
          - apply
      environment_name:
        description: GitHub environment name
        required: true
        default: dev
        type: string
      tfvars_file:
        description: Terraform tfvars file path relative to the repository root
        required: true
        default: infra/terraform/ovh-dedicated-reinstall/terraform.dev.tfvars
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: ovh-terraform-reinstall-${{ github.event.inputs.environment_name }}
  cancel-in-progress: false

jobs:
  terraform:
    uses: ./.github/workflows/reusable-ovh-terraform-reinstall.yml
    with:
      environment_name: ${{ inputs.environment_name }}
      terraform_working_directory: infra/terraform/ovh-dedicated-reinstall
      tfvars_file: ${{ inputs.tfvars_file }}
      operation: ${{ inputs.operation }}
      azure_subscription_id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      azure_tenant_id: ${{ vars.AZURE_TENANT_ID }}
      azure_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP_NAME }}
      azure_storage_account_name: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
      azure_storage_container_name: ${{ vars.AZURE_TERRAFORM_STATE_CONTAINER_NAME }}
      azure_storage_state_key: ${{ vars.OVH_TERRAFORM_STATE_KEY || 'ovh-dedicated-reinstall.tfstate' }}
      azure_key_vault_name: ${{ vars.AZURE_KEY_VAULT_NAME }}
      ssh_private_key_secret_name: ${{ vars.OVH_SSH_PRIVATE_KEY_SECRET_NAME || 'ovh-rag-reinstall-ssh-private-key' }}
      ssh_private_key_path: ${{ vars.OVH_SSH_PRIVATE_KEY_PATH || '~/.ssh/ovh-rag-reinstall-ed25519' }}
    secrets:
      azure_client_id: ${{ secrets.AZURE_CLIENT_ID }}
      ovh_application_key: ${{ secrets.OVH_APPLICATION_KEY }}
      ovh_application_secret: ${{ secrets.OVH_APPLICATION_SECRET }}
      ovh_consumer_key: ${{ secrets.OVH_CONSUMER_KEY }}
