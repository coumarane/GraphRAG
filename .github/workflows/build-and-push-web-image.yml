name: Build And Push Web Image

on:
  push:
    branches:
      - dev
    paths:
      - "frontend/**"
      - ".github/workflows/build-and-push-web-image.yml"

  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag (defaults to commit SHA)"
        required: false
        default: ""

env:
  REGISTRY_HOST: harbor.safranys.com
  HARBOR_PROJECT: chatwithdocs
  IMAGE_NAME: web
  DOCKERFILE_PATH: frontend/Dockerfile
  BUILD_CONTEXT: frontend

permissions:
  contents: write

jobs:
  validate:
    name: Frontend typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Typecheck and test
        working-directory: frontend
        run: |
          npm ci
          npx tsc --noEmit
          npx vitest run

  build-and-push:
    name: Build and Push Web Image
    runs-on: ubuntu-latest
    environment: dev
    needs: validate
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: ./.github/actions/login-harbor
        with:
          registry-host: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.HARBOR_REGISTRY_USERNAME }}
          password: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}

      # - name: Compute image tag
      #   shell: bash
      #   run: |
      #     TAG="${{ inputs.image_tag }}"
      #     TAG="${TAG:-$GITHUB_SHA}"
      #     echo "TAG=$TAG" >> "$GITHUB_ENV"

      # - name: Build image
      #   run: |
      #     IMAGE_REF="${REGISTRY_HOST}/${HARBOR_PROJECT}/${IMAGE_NAME}:${TAG}"
      #     docker build -t "$IMAGE_REF" -f "$DOCKERFILE_PATH" "$BUILD_CONTEXT"
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (with digest)
        id: build
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${GITHUB_SHA}}"
          IMAGE_REF="${REGISTRY_HOST}/${HARBOR_PROJECT}/${IMAGE_NAME}"
          IID_FILE="$(mktemp)"

          if [ -n "${INPUT_TAG}" ] && [ "${INPUT_TAG}" != "${GITHUB_SHA}" ]; then
            echo "Refusing to build a tag that is not the commit being validated: ${INPUT_TAG}"
            exit 1
          fi

          docker buildx build \
            --push \
            -f "${DOCKERFILE_PATH}" \
            -t "${IMAGE_REF}:${TAG}" \
            --iidfile "${IID_FILE}" \
            "${BUILD_CONTEXT}"

          DIGEST="$(cat "${IID_FILE}")"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed: ${IMAGE_REF}:${TAG}"
          echo "Digest:  ${DIGEST}"
          
      - name: Security scan image with Trivy
        env:
          TRIVY_IGNORE_UNFIXED: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY_HOST }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

      # - name: Tag and push image
      #   run: |
      #     IMAGE_REF="${REGISTRY_HOST}/${HARBOR_PROJECT}/${IMAGE_NAME}:${TAG}"
      #     LATEST_REF="${REGISTRY_HOST}/${HARBOR_PROJECT}/${IMAGE_NAME}:latest"
      #     docker tag "$IMAGE_REF" "$LATEST_REF"
      #     docker push "$IMAGE_REF"
      #     docker push "$LATEST_REF"

      - name: Logout from Harbor
        if: always()
        run: docker logout ${{ env.REGISTRY_HOST }}

  gitops:
    name: Update Web GitOps Digest
    runs-on: ubuntu-latest
    needs: [validate, build-and-push]
    if: ${{ github.ref == 'refs/heads/dev' && needs.validate.result == 'success' && needs.build-and-push.result == 'success' }}
    concurrency:
      group: gitops-kustomize-dev
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Require the validated commit
        run: |
          set -euo pipefail
          if [ "${{ needs.build-and-push.outputs.tag }}" != "${{ github.sha }}" ]; then
            echo "Refusing to promote ${{ needs.build-and-push.outputs.tag }}; expected ${{ github.sha }}"
            exit 1
          fi

      - name: Read DEV release gate
        id: gate
        run: infra/dev/check-release-gate.sh web >> "$GITHUB_OUTPUT"

      - name: Leave the web digest unchanged while the gate is closed
        if: steps.gate.outputs.promote != 'true'
        run: echo "Web image ${{ github.sha }} was scanned and was not written to infra/k8s/web. API, worker, migration, and CORS stay ahead of the upload screen."

      - name: Require API and worker digests from this commit
        if: steps.gate.outputs.promote == 'true'
        env:
          PROMOTE_SHA: ${{ github.sha }}
        run: infra/dev/assert-backend-promoted.sh "$PROMOTE_SHA"

      - name: Update kustomization image to digest (GitOps)
        if: steps.gate.outputs.promote == 'true'
        uses: ./.github/actions/update-kustomize-image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-name: harbor.safranys.com/chatwithdocs/web
          image-ref: ${{ env.REGISTRY_HOST }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}
          digest: ${{ needs.build-and-push.outputs.digest }}
          kustomization-dir: infra/k8s/web
          commit-message: "chore(dev): deploy web @${{ needs.build-and-push.outputs.digest }}"
