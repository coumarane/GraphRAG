name: Build And Push Worker Image

on:
  push:
    branches:
      - dev
    paths:
      - "src/**"
      - "alembic/**"
      - "config/**"
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile.worker"
      - "Dockerfile.worker-base"
      - ".github/workflows/build-and-push-worker-image.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional image tag (defaults to commit SHA)"
        required: false
        default: ""

env:
  REGISTRY_HOST: harbor.safranys.com
  HARBOR_PROJECT: chatwithdocs
  IMAGE_NAME: worker
  DOCKERFILE_PATH: Dockerfile.worker
  BUILD_CONTEXT: .
  BASE_IMAGE: harbor.safranys.com/chatwithdocs/worker-base:dev

permissions:
  contents: write

jobs:
  build-and-push:
    name: Build and Push Worker Image
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: ./.github/actions/login-harbor
        with:
          registry-host: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.HARBOR_REGISTRY_USERNAME }}
          password: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (with digest)
        id: build
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${GITHUB_SHA}}"
          IMAGE_REF="${REGISTRY_HOST}/${HARBOR_PROJECT}/${IMAGE_NAME}"
          IID_FILE="$(mktemp)"

          docker buildx build \
            --push \
            --build-arg "BASE_IMAGE=${BASE_IMAGE}" \
            -f "${DOCKERFILE_PATH}" \
            -t "${IMAGE_REF}:${TAG}" \
            -t "${IMAGE_REF}:latest" \
            --iidfile "${IID_FILE}" \
            "${BUILD_CONTEXT}"

          DIGEST="$(cat "${IID_FILE}")"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Pushed: ${IMAGE_REF}:${TAG}"
          echo "Digest:  ${DIGEST}"

      - name: Security scan image with Trivy
        continue-on-error: true
        env:
          TRIVY_IGNORE_UNFIXED: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY_HOST }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: 0
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Update kustomization image to digest (GitOps)
        if: github.ref == 'refs/heads/dev'
        uses: ./.github/actions/update-kustomize-image
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          image-name: harbor.safranys.com/chatwithdocs/worker
          image-ref: ${{ env.REGISTRY_HOST }}/${{ env.HARBOR_PROJECT }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          digest: ${{ steps.build.outputs.digest }}
          kustomization-dir: infra/k8s/worker
          commit-message: "chore(dev): deploy worker @${{ steps.build.outputs.digest }}"

      - name: Verify rendered worker image uses committed digest
        if: github.ref == 'refs/heads/dev'
        shell: bash
        run: |
          set -euo pipefail

          RENDERED_IMAGE="$(kubectl kustomize infra/k8s/worker | awk '/image: harbor.safranys.com\/chatwithdocs\/worker/ {print $2; exit}')"

          if [ -z "${RENDERED_IMAGE}" ]; then
            echo "Rendered worker manifest does not contain the Harbor worker image."
            exit 1
          fi

          case "${RENDERED_IMAGE}" in
            harbor.safranys.com/chatwithdocs/worker@sha256:*)
              ;;
            *)
              echo "Rendered worker image is not pinned by digest: ${RENDERED_IMAGE}"
              exit 1
              ;;
          esac

          echo "Rendered worker image: ${RENDERED_IMAGE}"

      - name: Logout from Harbor
        if: always()
        run: docker logout ${{ env.REGISTRY_HOST }}
