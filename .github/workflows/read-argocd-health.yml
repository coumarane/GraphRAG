name: Read Argo CD health

on:
  workflow_dispatch:
  repository_dispatch:
    types: [read-argocd-health]

permissions:
  contents: read
  id-token: write

env:
  K8S_INVENTORY: infra/ansible/kubernetes/inventory.ini

jobs:
  read:
    name: Read application health
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Restore shared SSH key from Key Vault
        id: restore_shared_ssh
        uses: ./.github/actions/restore-ssh-key-from-keyvault
        with:
          key-vault-name: ${{ vars.AZURE_KEY_VAULT_NAME }}
          secret-name: ${{ vars.OVH_SSH_PRIVATE_KEY_SECRET_NAME || 'ovh-rag-reinstall-ssh-private-key' }}
          key-path: ${{ vars.OVH_SSH_PRIVATE_KEY_PATH || '~/.ssh/ovh-rag-reinstall-ed25519' }}

      - name: Configure SSH for master
        id: master_ssh
        uses: ./.github/actions/configure-ssh-from-inventory
        with:
          inventory-path: ${{ env.K8S_INVENTORY }}
          inventory-group: master
          ssh-private-key-file: ${{ steps.restore_shared_ssh.outputs.key-path }}
          ssh-user: ubuntu

      - name: Read Argo CD and deployment status
        env:
          MASTER_HOST: ${{ steps.master_ssh.outputs.first-host }}
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes "$MASTER_HOST" 'bash -s' <<'EOSSH'
          set -euo pipefail
          export KUBECONFIG=/home/ubuntu/.kube/config
          echo "=== applications ==="
          kubectl -n argocd get applications.argoproj.io \
            -o custom-columns=NAME:.metadata.name,SYNC:.status.sync.status,HEALTH:.status.health.status,REV:.status.sync.revision
          echo "=== api operation ==="
          kubectl -n argocd get application chatwithdocs-api -o jsonpath='sync={.status.sync.status} rev={.status.sync.revision} health={.status.health.status} phase={.status.operationState.phase} message={.status.operationState.message}{"\n"}'
          kubectl -n argocd get application chatwithdocs-api -o jsonpath='{range .status.conditions[*]}{.type}={.message}{"\n"}{end}'
          echo "=== worker operation ==="
          kubectl -n argocd get application chatwithdocs-worker -o jsonpath='sync={.status.sync.status} rev={.status.sync.revision} health={.status.health.status} phase={.status.operationState.phase} message={.status.operationState.message}{"\n"}'
          kubectl -n chatwithdocs-api describe pod -l app.kubernetes.io/name=chatwithdocs-worker | awk '/^Name:|^Status:|State:|Reason:|Image:|Warning|Error|Failed|Pull/'
          echo "=== images ==="
          kubectl -n chatwithdocs-api get deploy api ingestion-worker \
            -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.template.spec.containers[0].image}{"\n"}{end}'
          kubectl -n chatwithdocs-web get deploy web \
            -o jsonpath='{range .items[*]}{.metadata.name}{" "}{.spec.template.spec.containers[0].image}{"\n"}{end}'
          echo "=== pods ==="
          kubectl -n chatwithdocs-api get pods -o wide
          kubectl -n chatwithdocs-web get pods -o wide
          echo "=== unready api logs ==="
          redact() { sed -E "s/as '[^']*'/as '<redacted>'/g; s#rediss?://[^ ]*#redis://<redacted>#g"; }
          for pod in $(kubectl -n chatwithdocs-api get pods -l app.kubernetes.io/name=chatwithdocs-api -o jsonpath='{range .items[?(@.status.containerStatuses[0].ready==false)]}{.metadata.name}{"\n"}{end}'); do
            echo "--- $pod previous ---"
            kubectl -n chatwithdocs-api logs "$pod" --previous --tail=30 2>&1 | redact || true
          done
          echo "=== redis url shape ==="
          ready=$(kubectl -n chatwithdocs-api get pods -l app.kubernetes.io/name=chatwithdocs-api -o jsonpath='{range .items[?(@.status.containerStatuses[0].ready==true)]}{.metadata.name}{"\n"}{end}' | head -n 1)
          echo "ready_pod=${ready}"
          kubectl -n chatwithdocs-api exec "$ready" -- python -c 'from pathlib import Path; u="";
[globals().__setitem__("u", line.split("=",1)[1]) for line in Path("/app/.env").read_text().splitlines() if line.startswith("REDIS_URL=")];
print("set", bool(u)); print("scheme", u.split(":",1)[0] if u else ""); print("length", len(u)); print("at", u.count("@")); print("colon", u.count(":")); print("slash", u.count("/")); tail=u.rsplit("@",1)[-1] if "@" in u else ""; print("tail_colon", ":" in tail); print("tail_host", tail.split(":",1)[0] if tail else ""); print("tail_port_digits", tail.split(":",1)[1].split("/",1)[0].isdigit() if ":" in tail else False)'
          echo "=== unready worker logs ==="
          for pod in $(kubectl -n chatwithdocs-api get pods -l app.kubernetes.io/name=chatwithdocs-worker -o jsonpath='{range .items[?(@.status.containerStatuses[0].ready!=true)]}{.metadata.name}{"\n"}{end}'); do
            echo "--- $pod previous ---"
            kubectl -n chatwithdocs-api logs "$pod" --previous --tail=30 2>&1 | redact || true
          done
          EOSSH
