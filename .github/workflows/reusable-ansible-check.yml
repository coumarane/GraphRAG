name: Reusable Ansible Check Workflow

on:
  workflow_call:
    inputs:
      environment_name:
        description: GitHub environment name
        required: false
        default: dev
        type: string
      inventory_path:
        description: Ansible inventory file path
        required: true
        type: string
      playbook_paths:
        description: Newline-separated list of playbook paths to run in check mode
        required: true
        type: string
      playbook_args:
        description: Extra arguments passed to each ansible-playbook invocation
        required: false
        default: ""
        type: string
      syntax_check_paths:
        description: Newline-separated list of playbooks to syntax-check before check mode
        required: false
        default: ""
        type: string
      ansible_collections:
        description: Space-separated Ansible collections to install
        required: false
        default: ""
        type: string
      install_sshpass:
        description: Install sshpass for password-based SSH auth
        required: false
        default: false
        type: boolean
      ssh_user:
        description: SSH username used when configuring key-based access
        required: false
        default: ubuntu
        type: string
      ssh_master_group:
        description: Inventory group name for master hosts
        required: false
        default: ""
        type: string
      ssh_worker_group:
        description: Inventory group name for worker hosts
        required: false
        default: ""
        type: string
      extra_vars:
        description: Extra vars string passed to ansible-playbook
        required: false
        default: ""
        type: string
      azure_subscription_id:
        description: Azure subscription used to retrieve the shared SSH key from Key Vault
        required: false
        default: ""
        type: string
      azure_tenant_id:
        description: Azure tenant used to retrieve the shared SSH key from Key Vault
        required: false
        default: ""
        type: string
      azure_key_vault_name:
        description: Azure Key Vault name that stores the shared SSH key
        required: false
        default: ""
        type: string
      ssh_private_key_secret_name:
        description: Azure Key Vault secret name that stores the shared SSH key
        required: false
        default: ""
        type: string
      ssh_private_key_path:
        description: Local path where the shared SSH key should be restored
        required: false
        default: "~/.ssh/shared-k8s-ed25519"
        type: string
      artifact_name:
        description: Name used for the uploaded check artifact
        required: false
        default: ansible-check-output
        type: string
    secrets:
      azure_client_id:
        required: false
      ansible_password:
        required: false
      harbor_admin_password:
        required: false
      harbor_db_password:
        required: false
      postgres_admin_password:
        required: false
      postgres_app_db:
        required: false
      postgres_app_user:
        required: false
      postgres_app_password:
        required: false
      pgadmin_email:
        required: false
      pgadmin_password:
        required: false

permissions:
  contents: read
  id-token: write

env:
  ANSIBLE_HOST_KEY_CHECKING: "False"

jobs:
  check:
    name: Run Ansible Check Mode
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Ansible
        uses: ./.github/actions/setup-ansible
        with:
          install-sshpass: ${{ inputs.install_sshpass }}
          collections: ${{ inputs.ansible_collections }}
          install-ansible-lint: "true"

      - name: Resolve workflow configuration
        id: resolve
        shell: bash
        env:
          EFFECTIVE_AZURE_CLIENT_ID: ${{ secrets.azure_client_id || secrets.AZURE_CLIENT_ID }}
          EFFECTIVE_AZURE_SUBSCRIPTION_ID: ${{ inputs.azure_subscription_id || vars.AZURE_SUBSCRIPTION_ID }}
          EFFECTIVE_AZURE_TENANT_ID: ${{ inputs.azure_tenant_id || vars.AZURE_TENANT_ID }}
          EFFECTIVE_AZURE_KEY_VAULT_NAME: ${{ inputs.azure_key_vault_name || vars.AZURE_KEY_VAULT_NAME }}
          EFFECTIVE_SSH_PRIVATE_KEY_SECRET_NAME: ${{ inputs.ssh_private_key_secret_name || vars.OVH_SSH_PRIVATE_KEY_SECRET_NAME || 'ovh-rag-reinstall-ssh-private-key' }}
          EFFECTIVE_SSH_PRIVATE_KEY_PATH: ${{ inputs.ssh_private_key_path || vars.OVH_SSH_PRIVATE_KEY_PATH || '~/.ssh/ovh-rag-reinstall-ed25519' }}
        run: |
          set -euo pipefail
          {
            echo "azure_client_id=${EFFECTIVE_AZURE_CLIENT_ID}"
            echo "azure_subscription_id=${EFFECTIVE_AZURE_SUBSCRIPTION_ID}"
            echo "azure_tenant_id=${EFFECTIVE_AZURE_TENANT_ID}"
            echo "azure_key_vault_name=${EFFECTIVE_AZURE_KEY_VAULT_NAME}"
            echo "ssh_private_key_secret_name=${EFFECTIVE_SSH_PRIVATE_KEY_SECRET_NAME}"
            echo "ssh_private_key_path=${EFFECTIVE_SSH_PRIVATE_KEY_PATH}"
          } >> "$GITHUB_OUTPUT"

      - name: Azure login
        if: ${{ steps.resolve.outputs.azure_key_vault_name != '' && steps.resolve.outputs.ssh_private_key_secret_name != '' && steps.resolve.outputs.azure_client_id != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ steps.resolve.outputs.azure_client_id }}
          tenant-id: ${{ steps.resolve.outputs.azure_tenant_id }}
          subscription-id: ${{ steps.resolve.outputs.azure_subscription_id }}

      - name: Restore shared SSH key from Key Vault
        if: ${{ steps.resolve.outputs.azure_key_vault_name != '' && steps.resolve.outputs.ssh_private_key_secret_name != '' }}
        id: restore_shared_ssh
        uses: ./.github/actions/restore-ssh-key-from-keyvault
        with:
          key-vault-name: ${{ steps.resolve.outputs.azure_key_vault_name }}
          secret-name: ${{ steps.resolve.outputs.ssh_private_key_secret_name }}
          key-path: ${{ steps.resolve.outputs.ssh_private_key_path }}

      - name: Configure SSH for master hosts
        if: ${{ inputs.ssh_master_group != '' }}
        uses: ./.github/actions/configure-ssh-from-inventory
        with:
          inventory-path: ${{ inputs.inventory_path }}
          inventory-group: ${{ inputs.ssh_master_group }}
          ssh-private-key-file: ${{ steps.restore_shared_ssh.outputs.key-path || steps.resolve.outputs.ssh_private_key_path }}
          ssh-user: ${{ inputs.ssh_user }}

      - name: Configure SSH for worker hosts
        if: ${{ inputs.ssh_worker_group != '' }}
        uses: ./.github/actions/configure-ssh-from-inventory
        with:
          inventory-path: ${{ inputs.inventory_path }}
          inventory-group: ${{ inputs.ssh_worker_group }}
          ssh-private-key-file: ${{ steps.restore_shared_ssh.outputs.key-path || steps.resolve.outputs.ssh_private_key_path }}
          ssh-user: ${{ inputs.ssh_user }}

      - name: Syntax check playbooks
        if: ${{ inputs.syntax_check_paths != '' }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r playbook; do
            [ -n "${playbook}" ] || continue
            ansible-playbook --syntax-check "${playbook}" -i "${{ inputs.inventory_path }}" ${{ inputs.playbook_args }}
          done <<'EOF'
          ${{ inputs.syntax_check_paths }}
          EOF

      - name: Run ansible-lint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          ansible-lint \
            -p \
            "${{ inputs.inventory_path }}" \
            $(while IFS= read -r playbook; do [ -n "${playbook}" ] && printf '%s ' "${playbook}"; done <<'EOF'
          ${{ inputs.playbook_paths }}
          EOF
          ) | tee .artifacts/ansible-lint.txt

      - name: Build effective Ansible extra vars
        id: effective_extra_vars
        shell: bash
        env:
          INPUT_EXTRA_VARS: ${{ inputs.extra_vars }}
          SECRET_ANSIBLE_PASSWORD: ${{ secrets.ansible_password }}
          SECRET_HARBOR_ADMIN_PASSWORD: ${{ secrets.harbor_admin_password }}
          SECRET_HARBOR_DB_PASSWORD: ${{ secrets.harbor_db_password }}
          SECRET_POSTGRES_ADMIN_PASSWORD: ${{ secrets.postgres_admin_password }}
          SECRET_POSTGRES_APP_DB: ${{ secrets.postgres_app_db }}
          SECRET_POSTGRES_APP_USER: ${{ secrets.postgres_app_user }}
          SECRET_POSTGRES_APP_PASSWORD: ${{ secrets.postgres_app_password }}
          SECRET_PGADMIN_EMAIL: ${{ secrets.pgadmin_email }}
          SECRET_PGADMIN_PASSWORD: ${{ secrets.pgadmin_password }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json
          import os
          import shlex

          extra_vars = {}
          raw = os.environ.get("INPUT_EXTRA_VARS", "").strip()
          if raw:
            for token in shlex.split(raw):
              key, sep, value = token.partition("=")
              if not sep:
                raise SystemExit(f"Invalid extra_vars token: {token}")
              extra_vars[key] = value

          secret_map = {
            "ansible_password": os.environ.get("SECRET_ANSIBLE_PASSWORD", ""),
            "harbor_admin_password": os.environ.get("SECRET_HARBOR_ADMIN_PASSWORD", ""),
            "harbor_db_password": os.environ.get("SECRET_HARBOR_DB_PASSWORD", ""),
            "postgres_admin_password": os.environ.get("SECRET_POSTGRES_ADMIN_PASSWORD", ""),
            "postgres_app_db": os.environ.get("SECRET_POSTGRES_APP_DB", ""),
            "postgres_app_user": os.environ.get("SECRET_POSTGRES_APP_USER", ""),
            "postgres_app_password": os.environ.get("SECRET_POSTGRES_APP_PASSWORD", ""),
            "pgadmin_email": os.environ.get("SECRET_PGADMIN_EMAIL", ""),
            "pgadmin_password": os.environ.get("SECRET_PGADMIN_PASSWORD", ""),
          }

          for key, value in secret_map.items():
            if value:
              extra_vars[key] = value

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
            fh.write("json<<EOF\n")
            fh.write(json.dumps(extra_vars))
            fh.write("\nEOF\n")
          PY

      - name: Run playbooks in check mode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .artifacts
          : > .artifacts/ansible-check.txt
          EXTRA_VARS='${{ steps.effective_extra_vars.outputs.json }}'
          EXTRA_ARGS='${{ inputs.playbook_args }}'
          while IFS= read -r playbook; do
            [ -n "${playbook}" ] || continue
            {
              echo "===== ${playbook} ====="
              if [ "${EXTRA_VARS}" != "{}" ]; then
                ansible-playbook "${playbook}" -i "${{ inputs.inventory_path }}" ${EXTRA_ARGS} --check --diff --extra-vars "${EXTRA_VARS}"
              else
                ansible-playbook "${playbook}" -i "${{ inputs.inventory_path }}" ${EXTRA_ARGS} --check --diff
              fi
              echo
            } | tee -a .artifacts/ansible-check.txt
          done <<'EOF'
          ${{ inputs.playbook_paths }}
          EOF

      - name: Upload check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: .artifacts/
