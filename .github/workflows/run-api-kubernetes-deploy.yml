name: Run API Kubernetes Deploy

on:
  # workflow_run:
  #   workflows: [ "Build And Push API Image" ]   # must match build workflow "name:"
  #   types: [ completed ]

  workflow_dispatch:
    inputs:
      acknowledge_argocd_bypass:
        description: "Emergency only. Set to true to bypass the Argo CD primary deploy path."
        required: false
        default: false
        type: boolean
      image_tag:
        description: "Optional Harbor image tag to deploy. Leave empty to use the committed digest. Do not use 'latest'."
        required: false
        default: ""

permissions:
  contents: read
  deployments: write
  id-token: write

concurrency:
  group: deploy-dev
  cancel-in-progress: false

env:
  REGISTRY_HOST: harbor.safranys.com
  HARBOR_PROJECT: chatwithdocs
  IMAGE_NAME: api
  K8S_INVENTORY: infra/ansible/kubernetes/inventory.ini

jobs:
  deploy:
    name: Emergency deploy API
    runs-on: ubuntu-latest
    environment: dev
    # if: >
    #   github.event_name == 'workflow_dispatch' ||
    #   (github.event_name == 'workflow_run' &&
    #    github.event.workflow_run.conclusion == 'success')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm manual bypass of Argo CD
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ inputs.acknowledge_argocd_bypass }}" != "true" ]; then
            echo "Argo CD is now the primary deploy mechanism for API."
            echo "Normal path:"
            echo "1. Build And Push API Image"
            echo "2. Argo CD syncs the committed digest from infra/k8s/api"
            echo
            echo "Use this workflow only for emergency/manual recovery with acknowledge_argocd_bypass=true."
            exit 1
          fi

      - name: Validate deploy image selection
        shell: bash
        run: |
          set -euo pipefail
          IMAGE_TAG="${{ inputs.image_tag }}"
          if [ -z "${IMAGE_TAG}" ]; then
            echo "Using committed kustomization digest for API deploy."
            if ! grep -Eq '^[[:space:]-]*digest:[[:space:]]+sha256:' infra/k8s/api/kustomization.yaml; then
              echo "Committed API kustomization is missing a digest. Build the API image first so GitOps updates the manifest."
              exit 1
            fi
            exit 0
          fi

          case "${IMAGE_TAG}" in
            latest|*:latest|*latest*)
              echo "Manual deploy using 'latest' is blocked. Use the committed digest path or a specific immutable tag."
              exit 1
              ;;
          esac

          echo "WARNING: manual image_tag override bypasses the committed GitOps digest for this deploy."

      - name: Optionally override kustomization image tag
        if: ${{ inputs.image_tag != '' }}
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          from pathlib import Path

          path = Path("infra/k8s/api/kustomization.yaml")
          text = path.read_text(encoding="utf-8")
          lines = text.splitlines()
          out = []
          in_images = False
          in_target = False
          inserted = False
          image_tag = """${{ inputs.image_tag }}"""

          for line in lines:
            stripped = line.strip()
            if stripped == "images:":
              in_images = True
              out.append(line)
              continue
            if in_images and line.startswith("- "):
              if in_target and not inserted:
                out.append(f"  newTag: {image_tag}")
                inserted = True
              in_target = False
            if in_images and stripped.startswith("- digest:"):
              continue
            if in_images and stripped == "name: harbor.safranys.com/chatwithdocs/api":
              in_target = True
            if in_target and stripped.startswith("digest:"):
              continue
            if in_target and stripped.startswith("newTag:"):
              out.append(f"  newTag: {image_tag}")
              inserted = True
              continue
            out.append(line)

          if in_target and not inserted:
            out.append(f"  newTag: {image_tag}")

          path.write_text("\n".join(out) + "\n", encoding="utf-8")
          PY

          sed -n '1,120p' infra/k8s/api/kustomization.yaml

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Restore shared SSH key from Key Vault
        id: restore_shared_ssh
        uses: ./.github/actions/restore-ssh-key-from-keyvault
        with:
          key-vault-name: ${{ vars.AZURE_KEY_VAULT_NAME }}
          secret-name: ${{ vars.OVH_SSH_PRIVATE_KEY_SECRET_NAME || 'ovh-rag-reinstall-ssh-private-key' }}
          key-path: ${{ vars.OVH_SSH_PRIVATE_KEY_PATH || '~/.ssh/ovh-rag-reinstall-ed25519' }}

      - name: Configure SSH for master
        id: master_ssh
        uses: ./.github/actions/configure-ssh-from-inventory
        with:
          inventory-path: ${{ env.K8S_INVENTORY }}
          inventory-group: master
          ssh-private-key-file: ${{ steps.restore_shared_ssh.outputs.key-path }}
          ssh-user: ubuntu

      - name: Export master host
        run: echo "MASTER_HOST=${{ steps.master_ssh.outputs.first-host }}" >> "$GITHUB_ENV"

      - name: Copy manifests to master
        run: |
          set -euo pipefail
          ssh "$MASTER_HOST" "mkdir -p /tmp/chatwithdocs-api"
          scp -r infra/k8s/api/* "${MASTER_HOST}:/tmp/chatwithdocs-api/"

      - name: Apply manifests on cluster
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_REGISTRY_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}
          AZURE_KEYVAULT_CSI_CLIENT_ID: ${{ secrets.AZURE_KEYVAULT_CSI_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          AZURE_KEYVAULT_CSI_CLIENT_SECRET: ${{ secrets.AZURE_KEYVAULT_CSI_CLIENT_SECRET || secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail

          if [ -z "${HARBOR_USERNAME:-}" ] || [ -z "${HARBOR_PASSWORD:-}" ]; then
            echo "Harbor credentials missing; set HARBOR_REGISTRY_USERNAME and HARBOR_REGISTRY_PASSWORD."
            exit 1
          fi
          if [ -z "${AZURE_KEYVAULT_CSI_CLIENT_ID:-}" ] || [ -z "${AZURE_KEYVAULT_CSI_CLIENT_SECRET:-}" ] || [ -z "${AZURE_TENANT_ID:-}" ]; then
            echo "Azure CSI credentials missing; set AZURE_KEYVAULT_CSI_CLIENT_ID or AZURE_CLIENT_ID, AZURE_KEYVAULT_CSI_CLIENT_SECRET or AZURE_CLIENT_SECRET, and AZURE_TENANT_ID."
            exit 1
          fi

          REMOTE_REGISTRY_HOST="$(printf '%q' "${REGISTRY_HOST}")"
          REMOTE_HARBOR_USERNAME="$(printf '%q' "${HARBOR_USERNAME}")"
          REMOTE_HARBOR_PASSWORD="$(printf '%q' "${HARBOR_PASSWORD}")"
          REMOTE_AZURE_KEYVAULT_CSI_CLIENT_ID="$(printf '%q' "${AZURE_KEYVAULT_CSI_CLIENT_ID}")"
          REMOTE_AZURE_KEYVAULT_CSI_CLIENT_SECRET="$(printf '%q' "${AZURE_KEYVAULT_CSI_CLIENT_SECRET}")"
          REMOTE_AZURE_TENANT_ID="$(printf '%q' "${AZURE_TENANT_ID}")"

          ssh "$MASTER_HOST" "export KUBECONFIG=/home/ubuntu/.kube/config REGISTRY_HOST=${REMOTE_REGISTRY_HOST} HARBOR_USERNAME=${REMOTE_HARBOR_USERNAME} HARBOR_PASSWORD=${REMOTE_HARBOR_PASSWORD} AZURE_KEYVAULT_CSI_CLIENT_ID=${REMOTE_AZURE_KEYVAULT_CSI_CLIENT_ID} AZURE_KEYVAULT_CSI_CLIENT_SECRET=${REMOTE_AZURE_KEYVAULT_CSI_CLIENT_SECRET} AZURE_TENANT_ID=${REMOTE_AZURE_TENANT_ID}; bash -s" <<'EOSSH'
          set -euo pipefail

          kubectl apply -f /tmp/chatwithdocs-api/namespace.yaml

          if ! kubectl get crd secretproviderclasses.secrets-store.csi.x-k8s.io >/dev/null 2>&1; then
            echo "Secrets Store CSI Driver is not installed. Run the k8s add-ons bootstrap workflow with install_azure_keyvault_csi=true first."
            exit 1
          fi

          kubectl -n chatwithdocs-api create secret docker-registry harbor-regcred \
            --docker-server="${REGISTRY_HOST}" \
            --docker-username="${HARBOR_USERNAME}" \
            --docker-password="${HARBOR_PASSWORD}" \
            --docker-email=admin@safranys.com \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl -n chatwithdocs-api create secret generic secrets-store-creds \
            --from-literal clientid="${AZURE_KEYVAULT_CSI_CLIENT_ID}" \
            --from-literal clientsecret="${AZURE_KEYVAULT_CSI_CLIENT_SECRET}" \
            --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n chatwithdocs-api label secret secrets-store-creds secrets-store.csi.k8s.io/used=true --overwrite

          kubectl apply -k /tmp/chatwithdocs-api

          # Force pods to refresh env/config on ConfigMap changes
          kubectl -n chatwithdocs-api rollout restart deploy/api

          if ! kubectl -n chatwithdocs-api rollout status deploy/api --timeout=300s; then
            echo "Rollout failed; collecting diagnostics..."
            kubectl -n chatwithdocs-api get pods -o wide
            kubectl -n chatwithdocs-api describe deploy/api
            kubectl -n chatwithdocs-api describe pods
            kubectl -n chatwithdocs-api get events --sort-by=.metadata.creationTimestamp | tail -n 30
            exit 1
          fi

          kubectl -n chatwithdocs-api get httproute api
          EOSSH
