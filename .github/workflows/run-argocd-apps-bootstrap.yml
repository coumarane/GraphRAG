name: Run Argo CD Apps Bootstrap

on:
  workflow_dispatch:
    inputs:
      target_revision:
        description: "Git revision for the Argo CD Application manifests"
        required: true
        default: dev
        type: string

permissions:
  contents: read
  id-token: write

env:
  K8S_INVENTORY: infra/ansible/kubernetes/inventory.ini

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Restore shared SSH key from Key Vault
        id: restore_shared_ssh
        uses: ./.github/actions/restore-ssh-key-from-keyvault
        with:
          key-vault-name: ${{ vars.AZURE_KEY_VAULT_NAME }}
          secret-name: ${{ vars.OVH_SSH_PRIVATE_KEY_SECRET_NAME || 'ovh-rag-reinstall-ssh-private-key' }}
          key-path: ${{ vars.OVH_SSH_PRIVATE_KEY_PATH || '~/.ssh/ovh-rag-reinstall-ed25519' }}

      - name: Configure SSH for master
        id: master_ssh
        uses: ./.github/actions/configure-ssh-from-inventory
        with:
          inventory-path: ${{ env.K8S_INVENTORY }}
          inventory-group: master
          ssh-private-key-file: ${{ steps.restore_shared_ssh.outputs.key-path }}
          ssh-user: ubuntu

      - name: Export master host
        run: echo "MASTER_HOST=${{ steps.master_ssh.outputs.first-host }}" >> "$GITHUB_ENV"

      - name: Copy Argo CD app manifests to master
        run: |
          set -euo pipefail
          ssh "$MASTER_HOST" "mkdir -p /tmp/argocd-apps-bootstrap/apps"
          scp -r infra/argocd/apps/* "${MASTER_HOST}:/tmp/argocd-apps-bootstrap/apps/"

      - name: Apply Argo CD Applications
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes "$MASTER_HOST" \
            "TARGET_REVISION='${{ inputs.target_revision }}' bash -s" <<'EOSSH'
          set -euo pipefail
          export KUBECONFIG=/home/ubuntu/.kube/config

          if ! kubectl get namespace argocd >/dev/null 2>&1; then
            echo "Argo CD namespace is missing. Run the add-ons bootstrap workflow with install_argocd=true first."
            exit 1
          fi

          for namespace in chatwithdocs-api chatwithdocs-web; do
            if ! kubectl get namespace "${namespace}" >/dev/null 2>&1; then
              echo "Namespace ${namespace} is missing. Run Run App Namespaces And Secrets Bootstrap first."
              exit 1
            fi
            if ! kubectl -n "${namespace}" get secret harbor-regcred >/dev/null 2>&1; then
              echo "Secret ${namespace}/harbor-regcred is missing. Run Run App Namespaces And Secrets Bootstrap first."
              exit 1
            fi
            if ! kubectl -n "${namespace}" get secret secrets-store-creds >/dev/null 2>&1; then
              echo "Secret ${namespace}/secrets-store-creds is missing. Run Run App Namespaces And Secrets Bootstrap first."
              exit 1
            fi
          done

          kubectl wait --for=condition=Established --timeout=300s \
            crd/applications.argoproj.io \
            crd/applicationsets.argoproj.io \
            crd/appprojects.argoproj.io

          python3 - "$TARGET_REVISION" <<'PY'
          import pathlib
          import sys

          target_revision = sys.argv[1]
          base = pathlib.Path("/tmp/argocd-apps-bootstrap/apps")
          for path in base.glob("*.yaml"):
              content = path.read_text(encoding="utf-8")
              content = content.replace("targetRevision: dev", f"targetRevision: {target_revision}")
              path.write_text(content, encoding="utf-8")
          PY

          kubectl apply -k /tmp/argocd-apps-bootstrap/apps
          kubectl -n argocd get applications.argoproj.io
          EOSSH
