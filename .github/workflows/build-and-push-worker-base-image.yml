name: Build And Push Worker Base Image

on:
  push:
    branches:
      - dev
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "Dockerfile.worker-base"
      - ".github/workflows/build-and-push-worker-base-image.yml"
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Optional base image tag (defaults to commit SHA)"
        required: false
        default: ""

env:
  REGISTRY_HOST: harbor.safranys.com
  HARBOR_PROJECT: chatwithdocs
  IMAGE_NAME: worker-base
  DOCKERFILE_PATH: Dockerfile.worker-base
  BUILD_CONTEXT: .
  STABLE_TAG: dev

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build and Push Worker Base Image
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Harbor
        uses: ./.github/actions/login-harbor
        with:
          registry-host: ${{ env.REGISTRY_HOST }}
          username: ${{ secrets.HARBOR_REGISTRY_USERNAME }}
          password: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push worker base
        id: build
        env:
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-${GITHUB_SHA}}"
          IMAGE_REF="${REGISTRY_HOST}/${HARBOR_PROJECT}/${IMAGE_NAME}"
          IID_FILE="$(mktemp)"

          docker buildx build \
            --push \
            -f "${DOCKERFILE_PATH}" \
            -t "${IMAGE_REF}:${TAG}" \
            -t "${IMAGE_REF}:${STABLE_TAG}" \
            --iidfile "${IID_FILE}" \
            "${BUILD_CONTEXT}"

          DIGEST="$(cat "${IID_FILE}")"

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "base_image=${IMAGE_REF}:${STABLE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Pushed: ${IMAGE_REF}:${TAG}"
          echo "Stable: ${IMAGE_REF}:${STABLE_TAG}"
          echo "Digest: ${DIGEST}"

      - name: Logout from Harbor
        if: always()
        run: docker logout ${{ env.REGISTRY_HOST }}
