name: Verify DEV upload

on:
  workflow_dispatch:
  repository_dispatch:
    types: [verify-dev-upload]

permissions:
  contents: read
  id-token: write

env:
  K8S_INVENTORY: infra/ansible/kubernetes/inventory.ini

jobs:
  verify:
    name: Authenticated upload
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 15
    steps:
      - name: Checkout dev
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Restore shared SSH key from Key Vault
        id: restore_shared_ssh
        uses: ./.github/actions/restore-ssh-key-from-keyvault
        with:
          key-vault-name: ${{ vars.AZURE_KEY_VAULT_NAME }}
          secret-name: ${{ vars.OVH_SSH_PRIVATE_KEY_SECRET_NAME || 'ovh-rag-reinstall-ssh-private-key' }}
          key-path: ${{ vars.OVH_SSH_PRIVATE_KEY_PATH || '~/.ssh/ovh-rag-reinstall-ed25519' }}

      - name: Configure SSH for master
        id: master_ssh
        uses: ./.github/actions/configure-ssh-from-inventory
        with:
          inventory-path: ${{ env.K8S_INVENTORY }}
          inventory-group: master
          ssh-private-key-file: ${{ steps.restore_shared_ssh.outputs.key-path }}
          ssh-user: ubuntu

      - name: Upload a document through the running API
        env:
          MASTER_HOST: ${{ steps.master_ssh.outputs.first-host }}
        run: |
          set -euo pipefail
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes "$MASTER_HOST" 'bash -s' <<'EOSSH'
          set -euo pipefail
          export KUBECONFIG=/home/ubuntu/.kube/config
          pod=$(kubectl -n chatwithdocs-api get pods -l app.kubernetes.io/name=chatwithdocs-api -o jsonpath='{range .items[?(@.status.containerStatuses[0].ready==true)]}{.metadata.name}{"\n"}{end}' | head -n 1)
          echo "pod=${pod}"
          test -n "$pod"
          kubectl -n chatwithdocs-api exec -i "$pod" -- python - <<'PY'
          import json
          import re
          import urllib.error
          import urllib.request
          from pathlib import Path
          from urllib.parse import urlparse

          env = {}
          for line in Path("/app/.env").read_text().splitlines():
              if not line or line.startswith("#") or "=" not in line:
                  continue
              key, value = line.split("=", 1)
              env[key] = value
          email = env.get("AUTH_BOOTSTRAP_EMAIL", "").strip()
          password = env.get("AUTH_BOOTSTRAP_PASSWORD", "").strip()
          tenant = env.get("AUTH_BOOTSTRAP_TENANT_KEY", "demo").strip() or "demo"
          print("bootstrap_email_set", bool(email))
          print("bootstrap_password_set", bool(password))
          if not email or not password:
              raise SystemExit(2)

          def request(method, url, payload=None, headers=None, raw=None):
              data = raw if raw is not None else (None if payload is None else json.dumps(payload).encode())
              req = urllib.request.Request(url, data=data, method=method)
              for key, value in (headers or {}).items():
                  req.add_header(key, value)
              if payload is not None:
                  req.add_header("content-type", "application/json")
              try:
                  with urllib.request.urlopen(req, timeout=90) as response:
                      return response.status, response.read()
              except urllib.error.HTTPError as exc:
                  return exc.code, exc.read()

          def error_text(body):
              text = body.decode("utf-8", "replace")[:240].replace("\n", " ")
              return re.sub(r"(?i)(sig|password|access_token)=[^&\s\"]+", r"\1=redacted", text)

          status, body = request(
              "POST",
              "http://127.0.0.1:8000/api/v1/auth/login",
              {"email": email, "password": password},
          )
          print("login", status)
          if status != 200:
              print("error_body", error_text(body))
              raise SystemExit(1)
          token = json.loads(body)["access_token"]
          auth = {"Authorization": "Bearer " + token, "X-Tenant-Key": tenant}
          pdf = b"%PDF-1.4\n1 0 obj<< /Type /Catalog >>endobj\ntrailer<< /Root 1 0 R >>\n%%EOF\n"
          status, body = request(
              "POST",
              "http://127.0.0.1:8000/api/v1/documents/uploads",
              {"filename": "rollout-001.pdf", "byte_size": len(pdf), "title": "rollout-001"},
              auth,
          )
          print("create", status)
          if status != 201:
              print("error_body", error_text(body))
              raise SystemExit(1)
          created = json.loads(body)
          target = created.get("upload") or {}
          if not target.get("url"):
              print("upload_url_present", False)
              raise SystemExit(1)
          parsed = urlparse(target["url"])
          print("put_host", parsed.netloc)
          print("has_uploads", "/uploads/" in parsed.path)
          print("has_staging", "/staging/" in parsed.path)
          put_headers = {str(key): str(value) for key, value in (target.get("headers") or {}).items()}
          status, _body = request(target.get("method") or "PUT", target["url"], headers=put_headers, raw=pdf)
          print("put", status)
          if status not in {200, 201}:
              print("error_body", error_text(_body))
              raise SystemExit(1)
          status, body = request(
              "POST",
              "http://127.0.0.1:8000/api/v1/documents/uploads/" + created["upload_id"] + "/complete",
              {"title": "rollout-001"},
              auth,
          )
          print("complete", status)
          if status != 202:
              print("error_body", error_text(body))
              raise SystemExit(1)
          completed = json.loads(body)
          print("document_id", completed.get("document_id"))
          print("run_status", completed.get("status"))
          status, body = request("GET", "http://127.0.0.1:8000/api/v1/documents", headers=auth)
          print("list", status)
          if status != 200:
              print("error_body", error_text(body))
              raise SystemExit(1)
          listed = json.loads(body)
          rows = listed if isinstance(listed, list) else listed.get("items") or listed.get("documents") or []
          print("list_contains_title", any(isinstance(row, dict) and row.get("title") == "rollout-001" for row in rows))
          PY
          EOSSH
