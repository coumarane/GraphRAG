name: Run App Namespaces And Secrets Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  K8S_INVENTORY: infra/ansible/kubernetes/inventory.ini

jobs:
  bootstrap:
    name: Bootstrap app namespaces and secrets
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Restore shared SSH key from Key Vault
        id: restore_shared_ssh
        uses: ./.github/actions/restore-ssh-key-from-keyvault
        with:
          key-vault-name: ${{ vars.AZURE_KEY_VAULT_NAME }}
          secret-name: ${{ vars.OVH_SSH_PRIVATE_KEY_SECRET_NAME || 'ovh-rag-reinstall-ssh-private-key' }}
          key-path: ${{ vars.OVH_SSH_PRIVATE_KEY_PATH || '~/.ssh/ovh-rag-reinstall-ed25519' }}

      - name: Configure SSH for master
        id: master_ssh
        uses: ./.github/actions/configure-ssh-from-inventory
        with:
          inventory-path: ${{ env.K8S_INVENTORY }}
          inventory-group: master
          ssh-private-key-file: ${{ steps.restore_shared_ssh.outputs.key-path }}
          ssh-user: ubuntu

      - name: Export master host
        run: echo "MASTER_HOST=${{ steps.master_ssh.outputs.first-host }}" >> "$GITHUB_ENV"

      - name: Bootstrap namespaces and app secrets
        env:
          HARBOR_USERNAME: ${{ secrets.HARBOR_REGISTRY_USERNAME }}
          HARBOR_PASSWORD: ${{ secrets.HARBOR_REGISTRY_PASSWORD }}
          AZURE_KEYVAULT_CSI_CLIENT_ID: ${{ secrets.AZURE_KEYVAULT_CSI_CLIENT_ID || secrets.AZURE_CLIENT_ID }}
          AZURE_KEYVAULT_CSI_CLIENT_SECRET: ${{ secrets.AZURE_KEYVAULT_CSI_CLIENT_SECRET || secrets.AZURE_CLIENT_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${HARBOR_USERNAME:-}" ] || [ -z "${HARBOR_PASSWORD:-}" ]; then
            echo "Harbor credentials missing; set HARBOR_REGISTRY_USERNAME and HARBOR_REGISTRY_PASSWORD."
            exit 1
          fi
          if [ -z "${AZURE_KEYVAULT_CSI_CLIENT_ID:-}" ] || [ -z "${AZURE_KEYVAULT_CSI_CLIENT_SECRET:-}" ]; then
            echo "Azure CSI credentials missing; set AZURE_KEYVAULT_CSI_CLIENT_ID or AZURE_CLIENT_ID and AZURE_KEYVAULT_CSI_CLIENT_SECRET or AZURE_CLIENT_SECRET."
            exit 1
          fi

          REMOTE_HARBOR_USERNAME="$(printf '%q' "${HARBOR_USERNAME}")"
          REMOTE_HARBOR_PASSWORD="$(printf '%q' "${HARBOR_PASSWORD}")"
          REMOTE_AZURE_KEYVAULT_CSI_CLIENT_ID="$(printf '%q' "${AZURE_KEYVAULT_CSI_CLIENT_ID}")"
          REMOTE_AZURE_KEYVAULT_CSI_CLIENT_SECRET="$(printf '%q' "${AZURE_KEYVAULT_CSI_CLIENT_SECRET}")"

          ssh "$MASTER_HOST" "export KUBECONFIG=/home/ubuntu/.kube/config HARBOR_USERNAME=${REMOTE_HARBOR_USERNAME} HARBOR_PASSWORD=${REMOTE_HARBOR_PASSWORD} AZURE_KEYVAULT_CSI_CLIENT_ID=${REMOTE_AZURE_KEYVAULT_CSI_CLIENT_ID} AZURE_KEYVAULT_CSI_CLIENT_SECRET=${REMOTE_AZURE_KEYVAULT_CSI_CLIENT_SECRET}; bash -s" <<'EOSSH'
          set -euo pipefail

          if ! kubectl get crd secretproviderclasses.secrets-store.csi.x-k8s.io >/dev/null 2>&1; then
            echo "Secrets Store CSI Driver is not installed. Run the k8s add-ons bootstrap workflow with install_azure_keyvault_csi=true first."
            exit 1
          fi

          for namespace in chatwithdocs-api chatwithdocs-web; do
            kubectl create namespace "${namespace}" --dry-run=client -o yaml | kubectl apply -f -

            kubectl -n "${namespace}" create secret docker-registry harbor-regcred \
              --docker-server=harbor.safranys.com \
              --docker-username="${HARBOR_USERNAME}" \
              --docker-password="${HARBOR_PASSWORD}" \
              --docker-email=admin@safranys.com \
              --dry-run=client -o yaml | kubectl apply -f -

            kubectl -n "${namespace}" create secret generic secrets-store-creds \
              --from-literal clientid="${AZURE_KEYVAULT_CSI_CLIENT_ID}" \
              --from-literal clientsecret="${AZURE_KEYVAULT_CSI_CLIENT_SECRET}" \
              --dry-run=client -o yaml | kubectl apply -f -

            kubectl -n "${namespace}" label secret secrets-store-creds secrets-store.csi.k8s.io/used=true --overwrite
          done

          kubectl get namespace chatwithdocs-api chatwithdocs-web
          kubectl -n chatwithdocs-api get secret harbor-regcred secrets-store-creds
          kubectl -n chatwithdocs-web get secret harbor-regcred secrets-store-creds
          EOSSH
