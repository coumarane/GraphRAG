$schema: https://json-schema.org/draft/2020-12/schema
$title: IngestionResult
$type: object
required:
  - status
  - tenant_id
  - document_id
  - version_id
  - ingestion_run_id
  - parser_used
  - warnings
properties:
  status: {enum: [completed, completed_with_warnings, partial, failed, cancelled]}
  tenant_id: {type: string}
  document_id: {type: string, format: uuid}
  version_id: {type: string, format: uuid}
  ingestion_run_id: {type: string, format: uuid}
  parser_requested: {type: string}
  parser_used: {type: string}
  pages: {type: integer, minimum: 0}
  elements: {type: object}
  chunks: {type: object}
  graph: {type: object}
  vectors: {type: integer, minimum: 0}
  duration_seconds: {type: number, minimum: 0}
  warnings: {type: array, items: {type: string}}
