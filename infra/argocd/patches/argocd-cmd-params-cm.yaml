apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cmd-params-cm
  labels:
    app.kubernetes.io/name: argocd-cmd-params-cm
    app.kubernetes.io/part-of: argocd
data:
  # Envoy Gateway terminates TLS for argocd.chatwithdocs.org and forwards HTTP
  # to Service port 80. Without insecure mode, argocd-server redirects HTTP→HTTPS
  # and creates a 307 loop through Cloudflare.
  server.insecure: "true"
