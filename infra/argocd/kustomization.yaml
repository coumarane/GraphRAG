apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

resources:
  - https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
  - namespace.yaml
  - httproute.yaml
  - apps

patches:
  - path: patches/tolerations.yaml
  - path: patches/argocd-cm-oidc.yaml
  - path: patches/argocd-rbac-cm.yaml
  - path: patches/argocd-secret-oidc.yaml
