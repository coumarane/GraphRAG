apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  labels:
    app.kubernetes.io/name: argocd-server
    app.kubernetes.io/part-of: argocd
spec:
  parentRefs:
    - name: public-gateway
      namespace: envoy-gateway-system
      sectionName: argocd-https
  hostnames:
    - argocd.chatwithdocs.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Service port 80 → argocd-server HTTP (requires server.insecure=true)
        - name: argocd-server
          port: 80
