# infra/argocd/apps/web.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: chatwithdocs-web
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/coumarane/chatwithdocs.git
    targetRevision: dev
    path: infra/k8s/web
  destination:
    server: https://kubernetes.default.svc
    namespace: chatwithdocs-web
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
