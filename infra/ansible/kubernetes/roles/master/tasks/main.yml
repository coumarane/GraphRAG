# kubernetes-ansible/roles/master/tasks/main.yml

- name: Ensure APT keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  tags:
    - k8s_install

- name: Download Kubernetes APT GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ common_kubernetes_apt_repo_version }}/deb/Release.key"
    dest: /tmp/kubernetes-apt-release.key
    mode: "0644"
  tags:
    - k8s_install

- name: Remove existing Kubernetes keyring if present (avoid invalid format)
  ansible.builtin.file:
    path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
    state: absent
  tags:
    - k8s_install

- name: Add Kubernetes APT GPG key (dearmor)
  ansible.builtin.command: >
    gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/kubernetes-apt-release.key
  tags:
    - k8s_install

- name: Add Kubernetes APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ common_kubernetes_apt_repo_version }}/deb/ /"
    state: present
    filename: kubernetes
  tags:
    - k8s_install

- name: Update apt cache after adding repo
  ansible.builtin.apt:
    update_cache: true
  tags:
    - k8s_install

- name: Install kubelet, kubeadm, kubectl
  ansible.builtin.apt:
    name:
      - "kubelet={{ common_kubernetes_version }}-1.1"
      - "kubeadm={{ common_kubernetes_version }}-1.1"
      - "kubectl={{ common_kubernetes_version }}-1.1"
    state: present
    allow_unauthenticated: true
  tags:
    - k8s_install

- name: Hold kubelet, kubeadm, kubectl packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
  tags:
    - k8s_install

- name: Initialize_Kubernetes_cluster
  ansible.builtin.command: "kubeadm init --pod-network-cidr={{ common_pod_network_cidr }}"
  args:
    creates: /etc/kubernetes/admin.conf
  register: master_kubeadm_init_output
  tags:
    - k8s_master

- name: Debug - Check existence of /etc/kubernetes/admin.conf
  ansible.builtin.stat:
    path: /etc/kubernetes/admin.conf
  register: master_admin_conf_stat
  tags:
    - k8s_master_debug

- name: Debug - Print admin.conf existence status
  ansible.builtin.debug:
    msg: "admin.conf exists: {{ master_admin_conf_stat.stat.exists }}. If false, kubeadm init failed."
  tags:
    - k8s_master_debug

- name: Debug - Effective HOME and SUDO_USER variables
  ansible.builtin.debug:
    msg:
      - "ansible_env.HOME: {{ ansible_env.HOME }}"
      - "ansible_env.SUDO_USER: {{ ansible_env.SUDO_USER | default('NOT SET') }}"
      - "ansible_user: {{ ansible_user }}"
      - "Calculated owner/group for .kube folder: {{ ansible_env.SUDO_USER | default(ansible_user) }}"
      - "Calculated target .kube config path: {{ ansible_env.HOME }}/.kube/config"
  tags:
    - k8s_master_debug

- name: Create .kube directory for user
  ansible.builtin.file:
    path: "/home/{{ ansible_user }}/.kube"
    state: directory
    mode: "0755"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
  tags:
    - k8s_master

- name: Copy kubeconfig to user's .kube directory
  ansible.builtin.copy:
    remote_src: true
    src: /etc/kubernetes/admin.conf
    dest: "/home/{{ ansible_user }}/.kube/config"
    owner: "{{ ansible_user }}"
    group: "{{ ansible_user }}"
    mode: "0644"
  tags:
    - k8s_master

- name: Generate kubeadm join command from master
  ansible.builtin.command: kubeadm token create --print-join-command
  register: master_join_command_output # This output is now registered against 'k8s-master' host
  changed_when: false

- name: Set fact with kubeadm join command for worker nodes
  ansible.builtin.set_fact:
    master_kubeadm_join_command: "{{ master_join_command_output.stdout_lines | last }}"
  delegate_to: localhost # Make this fact available on the control node for subsequent plays
  run_once: true

- name: Debug - Print join command (for master node)
  ansible.builtin.debug:
    msg: "Kubeadm join command for worker: {{ master_join_command_output.stdout_lines | last }}"
  # This debug still runs on the master, showing the master's generated command.
  # The fact 'master_join_command_output' is now correctly available as hostvars['k8s-master']['master_join_command_output']
