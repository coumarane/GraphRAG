# kubernetes-ansible/roles/common/tasks/main.yml

- name: Update apt cache and upgrade all packages
  ansible.builtin.apt:
    update_cache: true
    upgrade: dist
  tags:
    - system_prep

- name: Install required packages
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gpg
      - containerd
    state: present
  tags:
    - system_prep

- name: Check if swap is active
  ansible.builtin.command: swapon --show
  register: common_swap_status
  changed_when: false
  tags:
    - system_prep

- name: Disable swap and comment swap in fstab
  ansible.builtin.shell: |
    swapoff -a
    sed -i '/ swap / s/^/#/' /etc/fstab
  become: true
  when: common_swap_status.stdout | length > 0
  changed_when: true
  tags:
    - system_prep

- name: Ensure kernel modules are loaded
  ansible.builtin.copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
    mode: "0644"
  tags:
    - system_prep

- name: Load kernel modules immediately
  ansible.builtin.command: "modprobe {{ item }}"
  changed_when: false
  loop:
    - overlay
    - br_netfilter
  tags:
    - system_prep

- name: Configure sysctl for Kubernetes networking
  ansible.builtin.copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-ip6tables = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.ipv4.ip_forward = 1
    mode: "0644"
  tags:
    - system_prep

- name: Apply sysctl settings immediately
  ansible.builtin.command: sysctl --system
  changed_when: false
  tags:
    - system_prep

- name: Create containerd config directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    owner: root
    group: root
    mode: "0755"
  tags:
    - containerd

- name: Generate default containerd config
  ansible.builtin.command: containerd config default
  register: common_containerd_default_config
  changed_when: false
  when: not ansible_check_mode

- name: Apply containerd config with systemd cgroup driver
  ansible.builtin.copy:
    dest: /etc/containerd/config.toml
    content: "{{ common_containerd_default_config.stdout | regex_replace('SystemdCgroup = false', 'SystemdCgroup = true') }}"
    mode: "0644"
  notify: Restart containerd
  when: not ansible_check_mode
  tags:
    - containerd

- name: Flush containerd handlers before Kubernetes bootstrap
  ansible.builtin.meta: flush_handlers
  when: not ansible_check_mode
  tags:
    - containerd

- name: Enable and start containerd service
  ansible.builtin.systemd:
    name: containerd
    enabled: true
    state: started
  when: not ansible_check_mode
  tags:
    - containerd
