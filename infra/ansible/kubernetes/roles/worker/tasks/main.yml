# kubernetes-ansible/roles/worker/tasks/main.yml

- name: Download Kubernetes APT GPG key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/{{ common_kubernetes_apt_repo_version }}/deb/Release.key"
    dest: /tmp/kubernetes-apt-release.key
    mode: "0644"
  when: not ansible_check_mode
  tags:
    - k8s_install

- name: Add Kubernetes APT GPG key
  ansible.builtin.shell: gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg < /tmp/kubernetes-apt-release.key
  args:
    creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  when: not ansible_check_mode
  tags:
    - k8s_install

- name: Add Kubernetes APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ common_kubernetes_apt_repo_version }}/deb/ /"
    state: present
    filename: kubernetes
  when: not ansible_check_mode
  tags:
    - k8s_install

- name: Update apt cache after adding repo
  ansible.builtin.apt:
    update_cache: true
  when: not ansible_check_mode
  tags:
    - k8s_install

- name: Install kubelet, kubeadm, kubectl
  ansible.builtin.apt:
    name:
      - kubelet
      - kubeadm
      - kubectl
    state: present
  when: not ansible_check_mode
  tags:
    - k8s_install

- name: Hold kubelet, kubeadm, kubectl packages
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - kubelet
    - kubeadm
    - kubectl
  when: not ansible_check_mode
  tags:
    - k8s_install

- name: Join worker node to Kubernetes cluster
  ansible.builtin.command: "{{ hostvars[groups['master'][0]]['kubeadm_join_command'] }}"
  args:
    creates: /etc/kubernetes/kubelet.conf # Ensures this task only runs if not already joined
  when:
    - not ansible_check_mode
    - hostvars[groups['master'][0]]['kubeadm_join_command'] is defined
  tags:
    - k8s_worker

- name: Restart kubelet after worker join
  ansible.builtin.systemd:
    name: kubelet
    state: restarted
  when: not ansible_check_mode
  tags:
    - k8s_worker
