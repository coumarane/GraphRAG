postgresql_version: "18"
postgresql_repo: >-
  deb [signed-by=/usr/share/keyrings/postgresql-archive-keyring.gpg]
  https://apt.postgresql.org/pub/repos/apt
  {{ ansible_facts['distribution_release'] }}-pgdg main
postgresql_packages:
  - "postgresql-{{ postgresql_version }}"
  - "postgresql-client-{{ postgresql_version }}"
  - "postgresql-contrib-{{ postgresql_version }}"
postgresql_purge_packages:
  - "postgresql"
  - "postgresql-*"
  - "postgresql-client*"
  - "postgresql-common"
postgresql_service_name: postgresql
postgresql_conf_path: "/etc/postgresql/{{ postgresql_version }}/main/postgresql.conf"
postgresql_pg_hba_path: "/etc/postgresql/{{ postgresql_version }}/main/pg_hba.conf"
postgresql_data_root: /var/lib/postgresql
postgresql_config_root: /etc/postgresql
postgresql_run_root: /var/run/postgresql
postgresql_log_root: /var/log/postgresql
postgresql_repo_file: /etc/apt/sources.list.d/postgresql-pgdg.list
postgresql_rebuild: false
postgresql_listen_addresses: ["0.0.0.0"]
postgresql_allowed_cidrs: ["0.0.0.0/0"]
postgresql_auth_method: md5
postgresql_admin_user: postgres
# Default pulls from env var when not passed via extra-vars; playbook asserts it is set
postgresql_admin_password: "{{ lookup('env', 'POSTGRES_ADMIN_PASSWORD') | default('', true) }}"
# Application database bootstrap vars; prefer passing via extra-vars or GitHub secrets
postgresql_app_db: "{{ lookup('env', 'POSTGRES_APP_DB') | default('', true) }}"
postgresql_app_user: "{{ lookup('env', 'POSTGRES_APP_USER') | default('', true) }}"
postgresql_app_password: "{{ lookup('env', 'POSTGRES_APP_PASSWORD') | default('', true) }}"
# pgAdmin web UI (disabled by default; enable explicitly when needed)
postgresql_pgadmin_setup: false
postgresql_pgadmin_email: "{{ lookup('env', 'PGADMIN_EMAIL') | default('', true) }}"
postgresql_pgadmin_password: "{{ lookup('env', 'PGADMIN_PASSWORD') | default('', true) }}"
# pgAdmin repo codename (validated against the pgAdmin APT repo on 2026-08-12)
postgresql_pgadmin_distribution: "{{ ansible_facts['distribution_release'] }}"
postgresql_pgadmin_external_check: false
postgresql_pgadmin_install_method: auto  # auto|repo|container
postgresql_pgadmin_container_image: "dpage/pgadmin4:9.17"
postgresql_pgadmin_container_name: pgadmin4
postgresql_pgadmin_container_port: 8080
postgresql_pgadmin_container_data_dir: /var/lib/pgadmin

# TLS/Let’s Encrypt for pgAdmin behind nginx
postgresql_pgadmin_domain: "database.safranys.com"
postgresql_pgadmin_enable_letsencrypt: true
postgresql_pgadmin_letsencrypt_email: "admin@safranys.com"
postgresql_pgadmin_https_port: 443
postgresql_pgadmin_open_firewall: true
