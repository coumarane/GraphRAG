# kube-prometheus-stack Helm values for a small, single-node-friendly deployment
alertmanager:
  alertmanagerSpec:
    replicas: 1
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    tolerations:
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"

prometheus:
  prometheusSpec:
    replicas: 1
    resources:
      requests:
        cpu: 300m
        memory: 512Mi
      limits:
        cpu: 1
        memory: 1Gi
    # For single-node/dev clusters without a default StorageClass, use emptyDir instead of PVC
    storageSpec: {}
    tolerations:
      - key: "node-role.kubernetes.io/master"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "node-role.kubernetes.io/control-plane"
        operator: "Exists"
        effect: "NoSchedule"

grafana:
  enabled: true
  replicas: 1
  service:
    type: ClusterIP
  grafana.ini:
    server:
      root_url: https://prometheus.chatwithdocs.org
    auth:
      disable_login_form: false
      oauth_auto_login: false
    # auth.generic_oauth:
    #   enabled: true
    #   name: Keycloak
    #   allow_sign_up: true
    #   client_id: grafana
    #   client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
    #   scopes: openid profile email groups
    #   auth_url: https://identite.lodysaintgermain.com/realms/platform/protocol/openid-connect/auth
    #   token_url: https://identite.lodysaintgermain.com/realms/platform/protocol/openid-connect/token
    #   api_url: https://identite.lodysaintgermain.com/realms/platform/protocol/openid-connect/userinfo
    #   use_pkce: false
    #   role_attribute_path: >-
    #     contains(groups[*], 'grafana-admins') && 'Admin' ||
    #     contains(groups[*], 'grafana-editors') && 'Editor' || 'Viewer'
    #   groups_attribute_path: groups
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  tolerations:
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

defaultRules:
  create: true

kube-state-metrics:
  tolerations:
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"

prometheusOperator:
  tolerations:
    - key: "node-role.kubernetes.io/master"
      operator: "Exists"
      effect: "NoSchedule"
    - key: "node-role.kubernetes.io/control-plane"
      operator: "Exists"
      effect: "NoSchedule"
  admissionWebhooks:
    patch:
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
