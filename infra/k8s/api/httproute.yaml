apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: api
  labels:
    app.kubernetes.io/name: chatwithdocs-api
    app.kubernetes.io/part-of: chatwithdocs
spec:
  parentRefs:
    - name: public-gateway
      namespace: envoy-gateway-system
      sectionName: api-https
  hostnames:
    - api.chatwithdocs.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: api
          port: 80
