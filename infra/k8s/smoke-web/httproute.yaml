apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: smoke-web
  labels:
    app.kubernetes.io/name: chatwithdocs-smoke
    app.kubernetes.io/part-of: chatwithdocs
spec:
  parentRefs:
    - name: public-gateway
      namespace: envoy-gateway-system
      sectionName: web-https
  hostnames:
    - chatwithdocs.org
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: smoke-web
          port: 80
