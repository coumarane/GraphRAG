apiVersion: apps/v1
kind: Deployment
metadata:
  name: smoke-web
  labels:
    app.kubernetes.io/name: chatwithdocs-smoke
    app.kubernetes.io/part-of: chatwithdocs
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: chatwithdocs-smoke
      app.kubernetes.io/part-of: chatwithdocs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatwithdocs-smoke
        app.kubernetes.io/part-of: chatwithdocs
    spec:
      imagePullSecrets:
        - name: harbor-regcred
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: smoke-web
          image: harbor.safranys.com/chatwithdocs/smoke-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
