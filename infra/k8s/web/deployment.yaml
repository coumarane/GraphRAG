apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: chatwithdocs-web
    app.kubernetes.io/part-of: chatwithdocs
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: chatwithdocs-web
      app.kubernetes.io/part-of: chatwithdocs
  template:
    metadata:
      labels:
        app.kubernetes.io/name: chatwithdocs-web
        app.kubernetes.io/part-of: chatwithdocs
    spec:
      imagePullSecrets:
        - name: harbor-regcred
      initContainers:
        - name: render-env-file
          image: alpine:3.22
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              umask 077
              : > /work/.env
              for file in /mnt/azure-keyvault/*; do
                [ -f "$file" ] || continue
                name="$(basename "$file")"
                value="$(cat "$file")"
                printf '%s=%s\n' "$name" "$value" >> /work/.env
              done
              test -s /work/.env
              chmod 0444 /work/.env
          volumeMounts:
            - name: azure-keyvault-secrets
              mountPath: /mnt/azure-keyvault
              readOnly: true
            - name: runtime-env
              mountPath: /work
      tolerations:
        - key: "node-role.kubernetes.io/master"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "node-role.kubernetes.io/control-plane"
          operator: "Exists"
          effect: "NoSchedule"
      containers:
        - name: web
          image: harbor.safranys.com/chatwithdocs/web:digest
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
          args:
            - |
              set -a
              . /app/.env
              set +a
              exec node server.js
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
          volumeMounts:
            - name: runtime-env
              mountPath: /app/.env
              subPath: .env
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: azure-keyvault-secrets
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: web-azure-keyvault-env
            nodePublishSecretRef:
              name: secrets-store-creds
        - name: runtime-env
          emptyDir: {}
