$schema: https://json-schema.org/draft/2020-12/schema
$title: QueryResponse
$type: object
required: [answer, retrieval_mode, citations, retrieval_trace_id]
properties:
  answer: {type: string}
  retrieval_mode:
    enum: [naive, local, global, hybrid, multimodal, mix, auto]
  retrieval_trace_id: {type: string, format: uuid}
  warnings: {type: array, items: {type: string}}
  citations:
    type: array
    items:
      type: object
      required:
        - citation_id
        - document_id
        - document_version_id
        - document_name
        - page_start
        - page_end
        - chunk_id
        - modality
        - source_object_key
        - evidence
      properties:
        citation_id: {type: string}
        document_id: {type: string, format: uuid}
        document_version_id: {type: string, format: uuid}
        document_name: {type: string}
        page_start: {type: integer, minimum: 1}
        page_end: {type: integer, minimum: 1}
        section_path: {type: array, items: {type: string}}
        element_id: {type: [string, 'null'], format: uuid}
        chunk_id: {type: string, format: uuid}
        modality: {enum: [text, image, chart, diagram, table, equation, composite]}
        source_object_key: {type: string}
        evidence: {type: string}
  graph_paths:
    type: array
    items: {type: object}
